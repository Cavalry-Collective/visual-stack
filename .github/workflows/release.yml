name: Release

on:
  push:
    branches: [main]

jobs:
  publish:
    name: Tag and publish the version main declares
    runs-on: ubuntu-latest
    # Creates a tag and a release. The `main` ruleset guards the branch, not
    # tags, so nothing here needs to bypass it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Publishes the version already in the tree, with its CHANGELOG.md entry
      # as the notes. Does nothing when that version is already tagged, which is
      # every merge that did not change the plugin.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: node .github/scripts/publish-release.mjs
