name: Scorecard

# OpenSSF Scorecard rates the repository's supply-chain posture: branch
# protection, pinned actions, token permissions, release signing. It reads the
# repository rather than the code, so it runs on main and on a schedule, not on
# a pull request.
on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: read

jobs:
  analysis:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # Publishing the result is what lets the README badge read a score.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload the result
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif
