# Read by the SonarQube Cloud scan in .github/workflows/security.yml.
# The project key and organisation are the ones SonarQube Cloud derives when a
# GitHub repository is imported.
sonar.projectKey=Cavalry-Collective_visual-stack
sonar.organization=cavalry-collective
sonar.projectName=Visual Stack

sonar.sources=.
sonar.exclusions=docs/assets/**,node_modules/**,**/.vstack/**

# The shared shell is stamped into every page by lib/build-shell.mjs, because a
# page has to work with no external requests. That duplication is the design.
sonar.cpd.exclusions=plugins/vstack/**/*.html
