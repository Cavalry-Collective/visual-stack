# Read by SonarQube Cloud's Automatic Analysis, which scans the repository on
# its own and reports a quality gate on every pull request. It reads this file
# from the default branch only, so a change here takes effect once it is on
# main.
sonar.sources=.
sonar.exclusions=docs/assets/**,node_modules/**,**/.vstack/**
sonar.tests=plugins/vstack/skills/review/tests

# The shared shell is stamped into every page by lib/build-shell.mjs, because a
# page has to work with no external requests. That duplication is the design.
sonar.cpd.exclusions=plugins/vstack/**/*.html
