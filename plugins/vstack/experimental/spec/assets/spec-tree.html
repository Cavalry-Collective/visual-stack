<title>Spec · Visual Stack</title>
<style>
/* ══════════════════════════ spec chrome ══════════════════════════
   The shell is stamped from lib/shell — same tokens, same topbar, same
   controls as every other vstack page. Below it, only what the spec adds. */
/* vstack:shell tokens */
/* One palette for every vstack page. Roles, not colours: a page asks for
   --surface, not for white, so light and dark are the same stylesheet.

   The values come from `design/tokens.css`, which owns the palette. They are
   copied rather than imported because a page has to work opened off disk and
   inlined into an Artifact under a CSP that blocks every external request —
   nothing here may be fetched. `tests/design-tokens.mjs` fails when the two
   files disagree, so the copy cannot drift quietly.

   Page-specific hues (the story map's phase bands, the board's new/have/touch,
   the spec's priorities) stay in the page, below this block — they mean
   something only there. Everything here is shared, and is the reason a board
   and a spec look like the same product.

   Three states, in this order: the OS preference, then an explicit choice.
   `data-theme` absent means auto.

   The type scale is the guide's; the families are not. Space Grotesk and Inter
   would each be an external request, so every page reads in the system stack. */
:root{
  --paper:#efecf4; --surface:#ffffff; --surface-2:#f6f4f8;
  --ink:#171320; --ink-2:#453f52; --ink-3:#665e72;
  --line:#e6e2ec; --line-2:#cfc9d8;
  --brand:#e02b20; --brand-soft:#fff1f0; --brand-line:#ffb3ad;
  --ok:#0b8157; --ok-soft:#e9f9f2;
  --shadow:0 1px 2px rgba(23,19,32,.08);
  --shadow-pop:0 1px 2px rgba(23,19,32,.08),0 4px 16px rgba(23,19,32,.12);
  --window-shadow:0 4px 16px rgba(23,19,32,.12),0 16px 48px rgba(23,19,32,.22);
  --radius:8px;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0e0c13; --surface:#171320; --surface-2:#1e1a28;
  --ink:#f3f1f7; --ink-2:#bdb7c8; --ink-3:#8d86a0;
  --line:#2a2534; --line-2:#372f45;
  --brand:#ff6b60; --brand-soft:rgba(255,107,96,.14); --brand-line:rgba(255,107,96,.38);
  --ok:#2fb89b; --ok-soft:rgba(47,184,155,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-pop:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.5);
  --window-shadow:0 4px 16px rgba(0,0,0,.5),0 16px 48px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme=light]{
  --paper:#efecf4; --surface:#ffffff; --surface-2:#f6f4f8;
  --ink:#171320; --ink-2:#453f52; --ink-3:#665e72;
  --line:#e6e2ec; --line-2:#cfc9d8;
  --brand:#e02b20; --brand-soft:#fff1f0; --brand-line:#ffb3ad;
  --ok:#0b8157; --ok-soft:#e9f9f2;
  --shadow:0 1px 2px rgba(23,19,32,.08);
  --shadow-pop:0 1px 2px rgba(23,19,32,.08),0 4px 16px rgba(23,19,32,.12);
  --window-shadow:0 4px 16px rgba(23,19,32,.12),0 16px 48px rgba(23,19,32,.22);
  color-scheme:light;
}
:root[data-theme=dark]{
  --paper:#0e0c13; --surface:#171320; --surface-2:#1e1a28;
  --ink:#f3f1f7; --ink-2:#bdb7c8; --ink-3:#8d86a0;
  --line:#2a2534; --line-2:#372f45;
  --brand:#ff6b60; --brand-soft:rgba(255,107,96,.14); --brand-line:rgba(255,107,96,.38);
  --ok:#2fb89b; --ok-soft:rgba(47,184,155,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-pop:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.5);
  --window-shadow:0 4px 16px rgba(0,0,0,.5),0 16px 48px rgba(0,0,0,.6);
  color-scheme:dark;
}
/* /vstack:shell tokens */
:root{
  --panelw:320px;
  /* the spec's own hues, on top of the shared palette */
  --p1:#d23b2e; --p2:#b0761a; --p3:#4a5fce; --note:#8a53c0; --th:#0e7f8a;
}
@media (prefers-color-scheme:dark){:root{
  --p1:#f0685c; --p2:#d29a3f; --p3:#7d90ee; --note:#b98cec; --th:#3fb6d6;
}}
:root[data-theme=light]{--p1:#d23b2e;--p2:#b0761a;--p3:#4a5fce;--note:#8a53c0;--th:#0e7f8a}
:root[data-theme=dark]{--p1:#f0685c;--p2:#d29a3f;--p3:#7d90ee;--note:#b98cec;--th:#3fb6d6}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:13px/1.5 var(--font);
  -webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
[contenteditable]{outline:0}

/* vstack:shell css */
/* The chrome every vstack page wears: the top bar and the controls that sit in
   it. Page layout stays in the page — some of these are app shells that fill
   the viewport, some are documents that scroll — but the bar, the buttons and
   the segmented controls are the same object everywhere. */
/* The shell hides its own controls with `hidden` — the link dot when there is
   no link, the primary action on a page that doesn't send. A class that sets
   `display` outranks the browser's default [hidden] rule, and .btn/.linkdot
   both do, so state this here rather than trusting each page's reset. */
[hidden]{display:none!important}
/* Above anything the page floats at its edges. The bar makes a stacking context,
   so a menu opening out of it can never rise past a sibling with a higher
   z-index — which is how the comments handle came to sit on top of the settings
   menu. Raising the bar raises everything it opens. */
.vs-topbar{display:flex;align-items:center;gap:10px;padding:0 12px;height:46px;
  background:var(--surface);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:50}
.vs-topbar .brand{display:flex;align-items:center;gap:8px;min-width:0}
.vslink{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:inherit}
.vsmark{width:15px;height:15px;flex:none;color:var(--ink)}
.vslink:hover .vsmark{opacity:.8}
/* The tool's name, in the place the wordmark used to take. */
.brand b{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:280px}
.brand .eyebrow{font:600 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);white-space:nowrap}
.spacer{flex:1}
.sep{width:1px;height:20px;background:var(--line);flex:none}

/* Says the tool itself is unfinished — not that something is running. A page
   still being built should admit it in the chrome, not in a footnote. */
.wip{flex:none;font:700 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:#b0761a;background:color-mix(in srgb,#b0761a 12%,transparent);
  border:1px solid color-mix(in srgb,#b0761a 34%,transparent);
  border-radius:999px;padding:4px 8px;white-space:nowrap}
@media (prefers-color-scheme:dark){.wip{color:#d29a3f;background:color-mix(in srgb,#d29a3f 14%,transparent);
  border-color:color-mix(in srgb,#d29a3f 34%,transparent)}}
:root[data-theme=dark] .wip{color:#d29a3f;background:color-mix(in srgb,#d29a3f 14%,transparent);
  border-color:color-mix(in srgb,#d29a3f 34%,transparent)}
:root[data-theme=light] .wip{color:#b0761a;background:color-mix(in srgb,#b0761a 12%,transparent);
  border-color:color-mix(in srgb,#b0761a 34%,transparent)}

/* A switch is on or off. A segmented control is a choice between alternatives —
   using one to mean the other is why "Highlight new" read as two buttons. */
.switch{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px 0 9px;
  border:1px solid var(--line-2);border-radius:7px;background:var(--surface);color:var(--ink-2);
  font:inherit;font-weight:550;white-space:nowrap;cursor:pointer;flex:none}
.switch:hover{background:var(--surface-2);color:var(--ink)}
.switch .track{width:26px;height:15px;border-radius:999px;background:var(--line-2);
  position:relative;flex:none;transition:background .14s}
.switch .knob{position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;
  background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.35);transition:transform .14s}
/* On is the same "this one is selected" the segmented control uses. The brand
   red is the primary action — a view option wearing it read as the thing to
   press; solid black read like one too. */
.switch[aria-checked=true]{color:var(--ink);border-color:var(--line-2)}
/* The same near-black the segmented controls use when selected — on is on,
   whichever control is saying it. */
.switch[aria-checked=true] .track{background:var(--ink-2)}
.switch[aria-checked=true] .knob{transform:translateX(11px)}

/* buttons — one shape, three sizes of intent */
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:7px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:550;
  white-space:nowrap;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary[disabled]{opacity:.45;cursor:default;filter:none;pointer-events:none}
.btn[disabled]{opacity:.45;cursor:default;pointer-events:none}
.btn.sm{height:25px;padding:0 9px;font-size:11.5px}

/* A primary action with a ▾ beside it. The workspace and the story map both
   have one and they were built twice; same markup, same metrics, here. */
.split{display:inline-flex;position:relative;flex:none}
.split > .btn:first-child{border-radius:7px 0 0 7px}
.split > .caret{border-radius:0 7px 7px 0;width:28px;padding:0 8px;justify-content:center;
  border-left:1px solid color-mix(in srgb,#fff 28%,transparent)}

/* segmented control — modes, sizes, language, theme */
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden;
  background:var(--surface);flex:none}
.seg button{height:30px;padding:0 12px;font-weight:550;color:var(--ink-2);display:inline-flex;
  align-items:center;gap:6px;border:0;border-right:1px solid var(--line-2);background:none;
  cursor:pointer;font:inherit;font-weight:550}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface-2)}
/* Selected is near-black rather than black: dark enough to find at a glance,
   one step off the ink the page's own words are set in, so the bar never
   out-blacks the content. --ink-2 flips with the theme, so in dark mode this is
   the same step down from white. */
.seg button[aria-pressed=true]{background:var(--ink-2);color:var(--surface);font-weight:650}
.seg.sm button{height:25px;padding:0 9px;font-size:11.5px}
#langSwitch button,#themeSwitch button{padding:0 9px;font-size:11.5px;font-weight:600}
#themeSwitch button{padding:0 8px}
#themeSwitch svg{width:13px;height:13px;display:block}

/* ── settings: how you like the page, out of the way ── */
.cogwrap{position:relative;flex:none}
.cog{width:30px;height:30px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);
  color:var(--ink-2);display:grid;place-items:center;cursor:pointer}
.cog:hover,.cog[aria-expanded=true]{background:var(--surface-2);color:var(--ink)}
.cog svg{width:15px;height:15px;display:block}
.cogmenu{position:absolute;top:36px;right:0;z-index:60;background:var(--surface);
  border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow-pop);padding:9px;
  display:grid;gap:9px;min-width:210px}
.cogmenu[hidden]{display:none}
.cogmenu .row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.cogmenu .lbl{font-size:12px;color:var(--ink-2);white-space:nowrap}
.cogmenu .about{align-items:flex-start}
.cogmenu .abouts{display:grid;gap:3px;justify-items:end}
.cogmenu .abouts .one{display:flex;gap:8px;align-items:baseline}
/* An author `display` beats the UA rule for [hidden], so every row that is
   hidden from script needs its own. A page that never hears a server version
   showed "server —" for good without this. */
.cogmenu .abouts .one[hidden]{display:none}
.cogmenu .abouts em{font-style:normal;font-size:10.5px;letter-spacing:.03em;color:var(--ink-3)}
.cogmenu .abouts b{font:600 11px/1.3 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.cogmenu .stale{font-size:11px;line-height:1.4;color:var(--brand);justify-content:flex-start}
.cogmenu .stale[hidden]{display:none}
.cogmenu .about[hidden]{display:none}

/* the live link, stated rather than implied */
.linkdot{display:inline-flex;align-items:center;gap:6px;font:600 10.5px/1 var(--mono);
  letter-spacing:.03em;color:var(--ink-3);white-space:nowrap}
.linkdot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-3);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ink-3) 18%,transparent)}
.linkdot.on{color:var(--ok)}
.linkdot.on::before{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
/* Up, but nobody is waiting to read what you send. Amber rather than green,
   because the page works and the round will not — the same distinction the
   WIP tag makes. */
.linkdot.idle{color:#b0761a}
.linkdot.idle::before{background:#b0761a;box-shadow:0 0 0 3px color-mix(in srgb,#b0761a 22%,transparent)}
@media (prefers-color-scheme:dark){.linkdot.idle{color:#d29a3f}
  .linkdot.idle::before{background:#d29a3f;box-shadow:0 0 0 3px color-mix(in srgb,#d29a3f 22%,transparent)}}
:root[data-theme=dark] .linkdot.idle{color:#d29a3f}
:root[data-theme=dark] .linkdot.idle::before{background:#d29a3f;
  box-shadow:0 0 0 3px color-mix(in srgb,#d29a3f 22%,transparent)}

/* floating banners — the page talking back, never blocking the work.
   z-index above every panel and menu (comments panel 40–46, dropdowns 60–70):
   a snackbar that slides under other chrome reads as clipped. Full-screen
   overlays (z 200+) still cover it. */
.banner{position:fixed;left:50%;top:58px;transform:translateX(-50%);z-index:80;display:none;
  align-items:center;gap:10px;padding:8px 10px 8px 14px;border-radius:10px;box-shadow:var(--shadow-pop);
  font-size:12.5px;white-space:nowrap;max-width:calc(100% - 24px)}
.banner.on{display:flex}
.banner.dark{background:var(--ink);color:var(--surface)}
.banner.dark .btn{background:color-mix(in srgb,var(--surface) 16%,transparent);
  border-color:transparent;color:var(--surface)}
.banner.dark .btn:hover{background:color-mix(in srgb,var(--surface) 28%,transparent)}
.banner.good{background:var(--ok-soft);border:1px solid var(--ok);color:var(--ink)}
.banner.good .tick{color:var(--ok);font-weight:700}

/* the toast — VSShell.toast(); one element, appended on first use */
/* It is a popover, so the browser's own [popover] rules apply first: inset,
   margin and border are theirs to set and ours to put back. */
.vs-toast{position:fixed;inset:auto;left:50%;bottom:18px;transform:translateX(-50%);z-index:80;
  background:var(--ink);color:var(--surface);border:0;margin:0;padding:8px 14px;border-radius:8px;
  font-size:12.5px;box-shadow:var(--shadow-pop);opacity:0;pointer-events:none;transition:opacity .25s}
.vs-toast.on{opacity:1}

/* ── "there is a newer one" ──
   One line under the bar, in the workmanlike amber the WIP tag uses: it is
   information, not an alarm, and it goes away for good on ×. */
/* The bar and the notice as one block, because that is what a page's layout
   sized the row for: on its own, the notice would claim the content row of a
   `grid-template-rows:auto 1fr` shell and stretch down the window. Only ever
   built when there is a notice to put in it.
   It carries the bar's sticky, not just its place in the flow — a sticky child
   sticks within its containing block, so a shrink-wrapped wrapper would scroll
   the bar away with the notice on any page that is a document rather than an
   app shell. */
.vs-chrome{flex:none;min-width:0;position:sticky;top:0;z-index:50}
.vs-update{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:7px 12px;font-size:12px;color:var(--ink-2);
  background:color-mix(in srgb,#b0761a 8%,var(--surface));
  border-bottom:1px solid color-mix(in srgb,#b0761a 26%,transparent)}
.vs-update .v{font:500 9.5px/1 var(--mono);letter-spacing:.06em;color:#8a5c06;
  background:color-mix(in srgb,#b0761a 16%,transparent);border-radius:999px;padding:4px 7px;flex:none}
.vs-update .t{flex:1;min-width:0}
/* Both buttons are one height and centre their own contents. Left to padding
   and line-height they came out different sizes, and the × — which sits on the
   maths axis, not the baseline — hung high inside the smaller one. */
.vs-update button{font:inherit;font-size:11.5px;font-weight:600;color:var(--ink-2);
  border:1px solid var(--line-2);background:var(--surface);border-radius:6px;
  height:24px;padding:0 8px;flex:none;
  display:inline-flex;align-items:center;justify-content:center}
.vs-update button:hover{color:var(--ink);background:var(--surface-2)}
.vs-update .no{width:24px;padding:0;display:grid;place-items:center}
.vs-update .no svg{width:11px;height:11px;display:block}
.vs-update-how{flex-basis:100%;margin:2px 0 0;font-size:11.5px;color:var(--ink-3)}
.vs-update-how[hidden]{display:none}
.vs-update-how p{margin:0 0 4px}
.vs-update-how pre{margin:0 0 4px;padding:7px 9px;border-radius:7px;overflow-x:auto;
  font:500 11px/1.6 var(--mono);color:var(--ink);background:var(--surface);border:1px solid var(--line)}
.vs-update-how .auto{margin:0 0 4px}
@media (prefers-color-scheme:dark){.vs-update .v{color:#e2b567}}
:root[data-theme=dark] .vs-update .v{color:#e2b567}

@media (max-width:720px){
  .brand .eyebrow,.wip{display:none}
  .vs-topbar{gap:8px;padding:0 8px}
  /* What the bar keeps at this width is what the page is doing. The mark says
     which tool this is as well as the word beside it did, and the dot carries
     the link state on its own — colour is the whole message, the words only
     ever spelled it out. Both stay in the DOM: the text is still the dot's
     accessible name, and its title says it on hover. */
  .brand b{display:none}
  .linkdot{gap:0;font-size:0}
}
/* /vstack:shell css */

/* the page's own shell: topbar / content / timeline, always all visible */
#app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100%}
#mid{display:flex;min-height:0;position:relative}

/* ── the spec fills the whole content area ── */
#sheet{flex:1;min-width:0;overflow:auto;background:var(--surface);
  padding:clamp(1.2rem,3vw,2.2rem) clamp(1.4rem,4vw,3rem) 3rem}

/* ── initiative header ── */
.eyebrow2{font:700 10.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--brand);margin:0 0 .55rem;display:inline-flex;align-items:center;gap:.5rem}
.eyebrow2::before{content:"";width:1.4rem;height:2px;background:var(--brand);border-radius:2px}
h1{font-size:clamp(1.3rem,3vw,1.7rem);line-height:1.12;letter-spacing:-.02em;font-weight:750;margin:0 0 .3rem}
.goal{color:var(--ink-2);margin:0;max-width:64ch;font-size:13.5px}
.meta{margin-top:.55rem;font:500 10.5px/1.5 var(--mono);color:var(--ink-3);display:flex;gap:.6rem;flex-wrap:wrap}
#themesRow{display:flex;align-items:baseline;gap:.4rem;margin-top:.8rem;flex-wrap:wrap}
#themesRow .lbl{font:700 9.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.tpill{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;color:var(--th);
  background:color-mix(in srgb,var(--th) 9%,var(--surface));
  border:1px solid color-mix(in srgb,var(--th) 26%,transparent)}

/* ── epics: headings with a rule ── */
.epic{margin-top:2rem}
.ehead{display:flex;align-items:baseline;gap:.6rem;cursor:pointer;position:relative;padding-right:1.6rem}
.ehead .tw{align-self:center}
.ehead .elbl{font:800 9.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.ehead .ttl{font-size:15px;font-weight:700;letter-spacing:-.01em;min-width:0}
.ehead .rule{flex:1;height:1px;background:var(--line);align-self:center;min-width:2rem}
.ehead .count{font:600 10.5px/1 var(--mono);color:var(--ink-3);white-space:nowrap}
.tw{width:13px;flex:none;color:var(--ink-3);font-size:9px;transition:transform .14s;
  display:inline-grid;place-items:center}
[aria-expanded=true] > .tw,[aria-expanded=true] .tw:first-child{transform:rotate(90deg)}

/* ── stories: hairline rows, indented under their epic ──
   The indent has to clear the epic's own twisty and label, or a story reads as
   a sibling of its epic rather than a child of it. */
.slist{margin:.35rem 0 0 2.6rem}
.srow + .srow .shead{border-top:1px solid var(--line)}
.shead{display:flex;align-items:center;gap:.55rem;padding:.5rem .1rem;cursor:pointer;
  position:relative;padding-right:1.7rem}
.shead:hover{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.shead .ttl{font-weight:600;font-size:13px;min-width:0;flex:1}
/* the row's right-side cluster shares one metric so nothing floats */
.stag,.qmark,.shead .count{font:600 10px/16px var(--mono);flex:none;align-self:center;
  display:inline-flex;align-items:center}
.stag{color:var(--th)}
.qmark{font-weight:700;color:var(--note)}
.shead .count{color:var(--ink-3)}

/* the one destructive control, far right, on hover, two-step */
.del{position:absolute;right:.1rem;top:50%;transform:translateY(-50%);color:var(--ink-3);
  font-size:12px;line-height:1;padding:3px 5px;border-radius:5px;opacity:0;white-space:nowrap}
.ehead:hover .del,.shead:hover .del,.crow:hover .del,.del.armed{opacity:1}

.del.armed{font:700 10px/1 var(--mono);color:#fff;background:var(--brand)}

/* ── expanded story — acceptance criteria, and a margin for anything that
   isn't one. The criteria are the story's contract and take the width; the
   note beside them is for the aside that would otherwise be lost in chat.
   The whole body is one panel, so an open story is visibly one thing. */
.sbody{margin:.15rem 0 .8rem 1.75rem;padding:.7rem .9rem .8rem;
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,30%);
  column-gap:1.4rem;align-items:start}
.sbody > .col{min-width:0}
.sbody > .aside{border-left:1px solid var(--line);padding-left:1rem;min-height:3.2rem}
.snote{font-size:12.5px;line-height:1.45;color:var(--ink-2);min-height:2.4rem;outline:0}
.snote:empty::before{content:attr(data-ph);color:var(--ink-3);font-style:italic}
.snote:focus{background:var(--surface);border-radius:6px;box-shadow:0 0 0 3px var(--surface)}
/* one column each, until there isn't room for two */
@media (max-width:1080px){
  .sbody{grid-template-columns:minmax(0,1fr);row-gap:.2rem}
  .sbody > .aside{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:.5rem}
}
.sect{font:800 8.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin:.65rem 0 .3rem}
.sect:first-child{margin-top:0}
.crow{position:relative;padding:.3rem 1.7rem .3rem 0}

.ctext{flex:1;min-width:0;font-size:12.5px;color:var(--ink-2);font-weight:600}
.gwt{margin:.2rem 0 .15rem 1.15rem;display:grid;gap:2px}
.gwt[hidden]{display:none}
.gwt .gline{display:flex;gap:.45rem;align-items:baseline}
.gwt .glbl{font:700 8.5px/1.6 var(--mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);width:2.8rem;flex:none;text-align:right}
.gwt .gtext{flex:1;min-width:0;font:500 11.5px/1.5 var(--mono);color:var(--ink-2)}
.gwt .gtext:empty::before{content:attr(data-ph);color:var(--ink-3);font-style:italic}

/* clarifications live in the panel only; the tree just carries the ✎ marker.
   options are choices, not tags — radios, stacked */
.opts{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.opt{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);text-align:left;
  padding:3px 8px 3px 6px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}

.opt.picked{border-color:var(--ok);background:var(--ok-soft);color:var(--ink);font-weight:600}
.opt.picked .rad{border-color:var(--ok);background:var(--ok)}

/* quiet actions */
.acts{display:flex;gap:1rem;margin:.45rem 0 0}

/* vstack:shell js */
/* The behaviour behind the top bar: theme, language, the link dot, and the
   page's own name. Everything else — what the page does — is the page's.

   Nothing here touches the network or the document beyond the bar, so a page
   works identically served, opened off disk, or published as an Artifact. */
window.VSShell = (function () {
  const $ = s => document.querySelector(s);
  const KEY = { theme: 'vstack:theme', lang: 'vstack:lang', seen: 'vstack:update-seen' };
  const store = {
    get (k, d) { try { return localStorage.getItem(k) ?? d } catch { return d } },
    set (k, v) { try { localStorage.setItem(k, v) } catch {} },
  };

  /* ── theme: auto (whatever the OS says) / light / dark ──
     Auto is the absence of an override, so the page keeps following the system
     if it changes while open — and an Artifact viewer's own toggle still wins
     the same way it does on a page that never had this control. */
  let theme = store.get(KEY.theme, 'auto');
  function applyTheme () {
    if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
    document.querySelectorAll('#themeSwitch button').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.themeSet === theme));
    });
  }
  function setTheme (next) {
    theme = ['auto', 'light', 'dark'].includes(next) ? next : 'auto';
    store.set(KEY.theme, theme);
    applyTheme();
  }

  /* ── language: chrome only. Page content stays as authored. ── */
  const storedLang = store.get(KEY.lang, null);
  let lang = storedLang === 'zh' ? 'zh' : 'en';
  const langListeners = [];
  function applyLang () {
    // zh-CN, not zh: the specific tag is what picks the right font and
    // line-breaking for simplified Chinese.
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.querySelectorAll('#langSwitch button').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
    });
    langListeners.forEach(fn => { try { fn(lang) } catch {} });
    paintLink();
  }
  function setLang (next) {
    lang = next === 'zh' ? 'zh' : 'en';
    store.set(KEY.lang, lang);
    applyLang();
  }

  /* ── the live link, said out loud ── */
  /* Three states, not two. "The page reached its server" and "an agent session
     is waiting to read what you send" are different facts, and only the second
     is the one anyone actually wants to know. `watching` undefined means the
     page has no way to tell, and the dot behaves as it always did. Host name
     comes from window.__VSTACK_HOST__ (contracts/host.md), so no page bakes a
     product name in; the words live here, in both languages, so no page
     repeats them either. A page with something more specific to say passes
     `labels` to setLink and only those keys win. */
  let linked = null, linkLabels = null, watching;
  function linkWords () {
    const agent = window.__VSTACK_HOST__?.name || 'agent';
    return lang === 'zh' ? {
      on: `已连接 ${agent}`, off: '连接已断开', idle: '未连接',
      idleTitle: `页面是通的，但没有 ${agent} 会话在等待——发送的内容会一直留在这里，直到有会话接手。`,
      offTitle: `${agent} 会话已不再提供此页面——你写的内容只保存在这个标签页里。`,
    } : {
      on: `LINKED TO ${String(agent).toUpperCase()}`, off: 'LINK LOST', idle: 'UNLINKED',
      idleTitle: `This page is live, but no ${agent} session is waiting for it — what you send will sit here until one is.`,
      offTitle: `The ${agent} session is no longer serving this page — anything you write stays in this tab.`,
    };
  }
  function paintLink () {
    const el = $('#linkDot');
    if (!el || linked === null) return;
    el.hidden = false;
    const idle = linked && watching === false;
    el.classList.toggle('on', linked && !idle);
    el.classList.toggle('idle', !!idle);
    const words = linkWords();
    const label = !linked ? (linkLabels?.off ?? words.off)
      : idle ? (linkLabels?.idle ?? words.idle)
      : (linkLabels?.on ?? words.on);
    el.textContent = label;
    // Narrow bars show the dot and not the words, so the title has to say what
    // the words would have — the state that needs no explaining still needs
    // naming when nothing beside the colour is left.
    el.title = (!linked ? (linkLabels?.offTitle ?? words.offTitle)
      : idle ? (linkLabels?.idleTitle ?? words.idleTitle) : '') || label;
  }
  function setLink (up, labels, isWatching) {
    linked = !!up;
    if (labels) linkLabels = labels;
    if (isWatching !== undefined) watching = isWatching;
    paintLink();
  }
  /** The server saying who is listening now, without the page repeating itself. */
  function setWatching (isWatching) {
    if (watching === isWatching) return;
    watching = isWatching;
    paintLink();
  }
  const hideLink = () => { const el = $('#linkDot'); if (el) el.hidden = true };

  /* ── which version is running ──
     The page reports what served it, held from load; the server reports what it
     is on now. A tab open across an update shows both and offers the reload. */
  let pageVersion = null, serverVersion = null;
  function paintVersions () {
    const row = $('#cogAbout');
    if (!row) return;
    row.hidden = !pageVersion && !serverVersion;
    const put = (id, value) => { const el = $(id); if (el) el.textContent = value || '—' };
    put('#cogVersionPage', pageVersion || serverVersion);
    put('#cogVersionServer', serverVersion);
    const line = $('#cogServerLine');
    if (line) line.hidden = !serverVersion;
    const stale = $('#cogStale');
    if (stale) stale.hidden = !(pageVersion && serverVersion && pageVersion !== serverVersion);
  }
  /** What the server is on right now, which a page learns from its own payload. */
  function setServerVersion (version) {
    const next = version || null;
    if (serverVersion === next) return;
    serverVersion = next;
    paintVersions();
  }

  /* ── one live-link client, instead of one per page ──
     Wires the dot to a server: SSE when the page has an event stream, a plain
     poll for a server that only answers /ping. Either way the shell owns the
     socket-to-dot translation and the page only hears about its own events.

       VSShell.connect({ url, on: { push: ev => apply(ev) }, onLink })
       VSShell.connect({ poll: '/ping', onLink })

     SSE reconnects on its own, so the dot only ever reports what is true right
     now. `presence` — who is listening, said by the server rather than guessed
     from the socket — is handled here; every other event is the page's. */
  function connect (opts = {}) {
    const say = up => { setLink(up); try { opts.onLink?.(up) } catch {} };
    if (opts.poll) {
      const tick = async () => {
        try { const r = await fetch(opts.poll, { cache: 'no-store' }); say(r.ok) }
        catch { say(false) }
      };
      tick();
      const timer = setInterval(tick, opts.interval || 5000);
      return { stop: () => clearInterval(timer) };
    }
    const es = new EventSource(opts.url);
    es.onopen = () => say(true);
    es.onerror = () => say(false);
    es.addEventListener('presence', ev => {
      try { setWatching(JSON.parse(ev.data).watching) } catch {}
    });
    for (const [name, fn] of Object.entries(opts.on || {})) es.addEventListener(name, fn);
    return { stop: () => es.close(), source: es };
  }

  /* ── a toast: the page saying "done" without stopping anyone ── */
  /* Long enough for the opacity transition in shell.css to finish before the
     toast leaves the top layer, so it fades rather than vanishing. */
  const TOAST_FADE_MS = 300;
  let toastTimer = null;
  function toast (msg, ms = 2200) {
    let el = document.querySelector('.vs-toast');
    if (!el) {
      el = document.createElement('div');
      el.className = 'vs-toast';
      /* A modal dialog paints in the top layer, above every z-index there is,
         and its backdrop blurs what lies under it. A toast raised while one is
         open has to join the top layer or it is unreadable behind the very
         dialog whose failure it is reporting. */
      el.popover = 'manual';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    /* Promoted on each toast rather than left open, because the top layer
       stacks in the order things entered it: one promoted before a dialog
       would sit under it. Older browsers have no popover and lose nothing but
       the stacking. */
    try { el.showPopover(); } catch {}
    el.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      el.classList.remove('on');
      toastTimer = setTimeout(() => { try { el.hidePopover() } catch {} }, TOAST_FADE_MS);
    }, ms);
  }

  /* ── two-step confirm on one button ──
     First press arms it (class `armed`, plus whatever `arm` repaints); a second
     press inside the window fires; the window closing quietly disarms. The
     page styles `armed` and words the button — this owns only the dance. */
  function armConfirm (btn, { onConfirm, arm, disarm, ms = 4000 } = {}) {
    let timer = null;
    const reset = () => { timer = null; btn.classList.remove('armed'); try { disarm?.() } catch {} };
    btn.addEventListener('click', () => {
      if (timer) { clearTimeout(timer); reset(); onConfirm(); return }
      btn.classList.add('armed');
      try { arm?.() } catch {}
      timer = setTimeout(reset, ms);
    });
    return { armed: () => timer !== null, disarm: () => { if (timer) { clearTimeout(timer); reset() } } };
  }

  function name (pageName, eyebrow) {
    const n = $('#pageName'); const e = $('#pageEyebrow');
    if (n && pageName != null) n.textContent = pageName;
    if (e && eyebrow != null) e.textContent = eyebrow;
  }

  /** Mark the tool itself as unfinished. `false` takes it off again. */
  function wip (on, label) {
    const el = $('#wip');
    if (!el) return;
    el.hidden = !on;
    el.textContent = label || 'Work in progress';
  }

  /* ── a newer Visual Stack than this one ──
     The server looked it up before serving this page and left the answer on
     `window.__VSTACK_UPDATE__`; nothing here reaches the network. Dismissal is
     remembered per version, so saying "not now" to 4.2 stays said, and 4.3
     asks once. */
  function updateNotice () {
    const info = window.__VSTACK_UPDATE__;
    // Dismissal is per release: saying "not now" to this one stays said, and
    // the next one asks once. `key` is the release — the sentence reads the
    // same every time, so remembering the sentence would silence every future
    // release too.
    const seen = info?.key || info?.title;
    // Nothing here decides whether a release is worth mentioning yet — the
    // server holds back the first sighting (lib/update-check.mjs), because a
    // page served on an ephemeral port has no memory that outlives its run.
    if (!info?.title || store.get(KEY.seen, '') === seen) return;
    const bar = document.createElement('div');
    bar.className = 'vs-update';
    bar.innerHTML =
      `<span class="v">${esc(info.pill || 'new')}</span>` +
      `<span class="t">${esc(info.title)}</span>` +
      `<button class="how">Update instructions</button>` +
      // Drawn, not typed: the × glyph hangs off the maths axis, so no amount of
      // centring the line box centres the mark you actually see. Same treatment
      // as the cog.
      `<button class="no" aria-label="Dismiss">` +
      `<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" ` +
      `stroke-width="1.6" stroke-linecap="round"><path d="M4.5 4.5 11.5 11.5M11.5 4.5 4.5 11.5"/>` +
      `</svg></button>`;
    const how = document.createElement('div');
    how.className = 'vs-update-how';
    how.hidden = true;
    const lead = info.howLead || 'To update:';
    how.innerHTML = `<p>${esc(lead)}</p><pre>${esc((info.install || []).join('\n'))}</pre>` +
      (info.auto ? `<p class="auto">${esc(info.auto)}</p>` : '');
    bar.appendChild(how);
    bar.querySelector('.how').onclick = () => { how.hidden = !how.hidden };
    bar.querySelector('.no').onclick = () => {
      store.set(KEY.seen, seen);
      // Say it to the server too, when there is one: this page's memory of it
      // lasts as long as its origin does, which for a server on an ephemeral
      // port is one run. Nothing here depends on the answer.
      if (info.dismiss) {
        try {
          fetch(info.dismiss, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ key: seen }),
          }).catch(() => {});
        } catch {}
      }
      bar.remove();
    };
    // Pages lay their chrome out in a row grid — `grid-template-rows:auto 1fr`
    // and the like — so a bare sibling of the bar takes the row meant for the
    // content and gets stretched down the whole window. The notice moves in
    // with the bar instead, leaving the layout the single child it sized for.
    const top = $('.vs-topbar');
    if (!top) return;
    let slot = top.parentElement;
    if (!slot || !slot.classList.contains('vs-chrome')) {
      slot = document.createElement('div');
      slot.className = 'vs-chrome';
      top.insertAdjacentElement('beforebegin', slot);
      slot.appendChild(top);
    }
    slot.appendChild(bar);
  }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* The cog: one button for the two choices nobody makes twice. */
  function wireSettings () {
    const btn = $('#settingsBtn'), menu = $('#settingsMenu');
    if (!btn || !menu) return;
    const open = on => { menu.hidden = !on; btn.setAttribute('aria-expanded', String(on)) };
    // A control in the cog's slot can act on the page behind it, so the page
    // needs a way to put the menu away first.
    closeSettings = () => open(false);
    btn.addEventListener('click', e => { e.stopPropagation(); open(menu.hidden) });
    menu.addEventListener('click', e => e.stopPropagation());
    document.addEventListener('click', () => open(false));
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !menu.hidden) open(false) });
  }

  function init (opts = {}) {
    document.querySelectorAll('#themeSwitch button').forEach(b => {
      b.addEventListener('click', () => setTheme(b.dataset.themeSet));
    });
    document.querySelectorAll('#langSwitch button').forEach(b => {
      b.addEventListener('click', () => setLang(b.dataset.lang));
    });

    // `defaultLang` is what the artifact was authored in — it opens that way
    // once, and after that the reader's own choice is the one that sticks.
    if (opts.defaultLang && !storedLang) lang = opts.defaultLang === 'zh' ? 'zh' : 'en';
    if (opts.lang) { lang = opts.lang === 'zh' ? 'zh' : 'en'; store.set(KEY.lang, lang); }
    // Not every page sends something back — the form doesn't — so the primary
    // action stays out of the bar unless a page asks for it.
    const send = $('#send');
    if (send && opts.send) send.hidden = false;
    if (opts.wip) wip(true, typeof opts.wip === 'string' ? opts.wip : undefined);
    name(opts.name, opts.eyebrow);
    wireSettings();
    pageVersion = (window.__VSTACK_BUILD__ || {}).version || null;
    paintVersions();
    applyTheme();
    applyLang();
    updateNotice();
    return api;
  }

  let closeSettings = () => {};

  const api = {
    init, setTheme, setLang, setLink, setWatching, setServerVersion, hideLink, name, wip,
    connect, toast, armConfirm, esc,
    closeSettings: () => closeSettings(),
    get theme () { return theme },
    get lang () { return lang },
    onLang (fn) { langListeners.push(fn) },
  };
  return api;
})();

/* ── the scrubber ──
   An ordered set of states and a handle that moves between them: versions on
   the spec and the review workspace, release phases on phase-preview. The
   page says what the stops are and what showing one does; this owns the track,
   the ticks, the drag, and the caption.

     VSScrub.mount({ onPick: id => showThat(id) })
     VSScrub.set({ items: [{ id, cap, label, sub }], active: id })

   `cap` is the label under the tick (v3, P2), `label` names the stop, and
   `sub` is the line beneath it — both are escaped here, so a page never has to
   remember to. */
window.VSScrub = (function () {
  const $ = s => document.querySelector(s);
  const esc = s => window.VSShell.esc(s ?? '');
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  let items = [];
  let active = null;
  let onPick = () => {};
  let wired = false;

  const index = () => Math.max(0, items.findIndex(i => i.id === active));
  const pct = i => items.length < 2 ? 100 : (i / (items.length - 1)) * 100;

  function pickAt (clientX) {
    const track = $('#tlTrack');
    if (!track || !items.length) return null;
    const r = track.getBoundingClientRect();
    return items[Math.round(clamp((clientX - r.left) / r.width, 0, 1) * (items.length - 1))]?.id;
  }
  function pick (id) {
    if (id == null || id === active) return;
    active = id;
    paint();
    onPick(id);
  }
  const step = d => { const n = items[index() + d]; if (n) pick(n.id) };

  function paint () {
    const track = $('#tlTrack');
    if (!track) return;
    const i = index();
    track.querySelectorAll('.tick').forEach(t => t.remove());
    items.forEach((it, k) => {
      const t = document.createElement('div');
      t.className = 'tick' + (k <= i ? ' past' : '');
      t.style.left = pct(k) + '%';
      t.innerHTML = `<span class="cap">${esc(it.cap)}</span>`;
      if (it.label) t.title = it.label;
      t.onclick = e => { e.stopPropagation(); pick(it.id) };
      track.appendChild(t);
    });
    $('#tlHandle').style.left = pct(i) + '%';
    $('#tlFill').style.width = pct(i) + '%';
    const cur = items[i];
    $('#tlMeta').innerHTML = cur
      ? `<div class="row"><b>${esc(cur.cap)}</b> <span class="lab">${esc(cur.label)}</span></div>` +
        `<div class="row">${esc(cur.sub)}</div>`
      : '';
    $('#tlPrev').disabled = i === 0;
    $('#tlNext').disabled = i >= items.length - 1;
  }

  function mount (opts = {}) {
    if (opts.onPick) onPick = opts.onPick;
    if (wired || !$('#tlTrack')) return api;
    wired = true;
    $('#tlPrev').onclick = () => step(-1);
    $('#tlNext').onclick = () => step(1);
    $('#tlHandle').addEventListener('pointerdown', e => {
      e.preventDefault();
      const mv = ev => pick(pickAt(ev.clientX));
      const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up) };
      addEventListener('pointermove', mv); addEventListener('pointerup', up);
    });
    $('#tlTrack').addEventListener('pointerdown', e => {
      if (e.target.closest('#tlHandle, .tick')) return;
      pick(pickAt(e.clientX));
    });
    return api;
  }

  const api = {
    mount,
    set ({ items: list, active: a }) {
      if (list) items = list;
      if (a !== undefined) active = a;
      if (active == null && items.length) active = items[items.length - 1].id;
      paint();
      return api;
    },
    /** Move one stop back or forward — what arrow keys and the ‹ › buttons do. */
    step,
    get active () { return active },
    get items () { return items },
  };
  return api;
})();
/* /vstack:shell js */
</script>

<script>
/* The tree IS the spec — one initiative, its epics, their user stories, and
   themes as the labels that span them. specs/…md is generated from this, never
   the other way. Served through json-bridge.mjs the document comes from /doc
   and Send posts it back; opened off disk it falls back to the demo above. */
const BRIDGE = window.__VSTACK_BRIDGE__ || null;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let LANG = VSShell.lang;   // the shell owns the choice; every page shares it
const STR = {

  epicLbl: ['Epic', '史诗'],
  stories: ['stories', '个故事'], scenarios: ['scenarios', '个场景'],
  collapse: ['Collapse all', '全部收起'], expand: ['Expand all', '全部展开'],
  send: ['Send to Claude', '发送给 Claude'], sent: ['Sent ✓', '已发送 ✓'],
  acLbl: ['Acceptance criteria', '验收标准'],
  noteLbl: ['Notes', '备注'],
  notePh: ['Anything worth remembering about this story…', '关于这个故事值得记下的内容…'],
  scenario: ['Scenario', '场景'],
  given: ['Given', '前提'], when: ['When', '当'], then: ['Then', '则'], andLbl: ['And', '且'],
  addScen: ['+ scenario', '+ 场景'],
  addS: ['+ story', '+ 故事'], addE: ['+ epic', '+ 史诗'],
  newScen: ['New scenario', '新场景'],
  newStory: ['As a …, I want to …, so that …', '作为…，我想要…，以便…'],
  newEpic: ['As a …, I want to …, so that …', '作为…，我想要…，以便…'],
  clarLbl: ['Clarification', '澄清'],
  confirmDel: ['delete?', '删除？'],
  refreshed: ['Claude updated the spec', 'Claude 更新了规格'],
  apply: ['Review changes', '查看更新'], dismiss: ['Later', '稍后'],
  qpTitle: ['Clarifications', '澄清事项'],
  qpNeed: [n => `${n} waiting on an answer`, n => `${n} 条待回答`],
  qpAnswerPh: ['Type an answer…', '输入回答…'],
  qpOther: ['Something else…', '其他…'],
  qpDismiss: ['Dismiss', '忽略'],
  vOpened: ['Opened', '打开'],
  vSent: ['Sent to Claude', '发送给 Claude'],
  vClaude: ['Claude’s update', 'Claude 的更新'],
  current: ['current', '当前'],
  viewingOld: [n => `Viewing v${n} — read only`, n => `正在查看 v${n}——只读`],
  backToNow: ['Back to current', '回到当前'],

const t = k => STR[k][LANG === 'zh' ? 1 : 0];

let doc = null;   // { feature, title, goal, source[], themes:[name], epics:[{id,title,open,stories[]}] }
let pendingPush = null;
let dirtySinceSend = false;

/* an older flat document wraps into a single epic; older criteria
   ({text, verify}) become Gherkin scenarios */
function migrate (d) {
  if (!d.epics) d.epics = d.stories ? [{ id: 'e1', title: d.title || 'Epic', open: true, stories: d.stories }] : [];
  delete d.stories;
  d.themes ||= [];
  d.epics.forEach(ep => {
    ep.open ??= true; ep.stories ||= [];
    ep.stories.forEach(s => {
      s.notes ||= []; s.crit ||= [];
      // requirements were folded into the criteria — an older document keeps
      // what it said by moving them into the note rather than dropping them
      if (s.reqs?.length) { s.note = [s.note, ...s.reqs].filter(Boolean).join(' · '); delete s.reqs }
      s.crit.forEach(c => {
        if (c.text !== undefined && c.scenario === undefined) {
          c.scenario = c.text; c.then = c.verify || '';
          delete c.text; delete c.verify;
        }
        c.given ??= ''; c.when ??= ''; c.then ??= ''; c.and ??= '';
        c.notes ||= [];
      });
    });
  });
  return d;
}
const allStories = () => doc.epics.flatMap(ep => ep.stories);

/* ── versions — the trail json-bridge keeps beside the document ──
   The server records one on every open, send and Claude rewrite, so closing
   the tab and coming back doesn't lose the history the way an in-page array
   would. Only the index is fetched up front; bodies come on demand. Opened off
   disk there is one version — the one in front of you. */
let versions = [];        // [{n, label, date, json}] — json null until fetched
let viewing = 1;          // the version on screen; latest == live and editable
let stash = null;         // the live document, parked while an old one is on screen
let navSeq = 0;           // scrubbing outruns the fetches; only the last one wins
const latest = () => versions.length ? versions[versions.length - 1].n : 1;
const isHistory = () => viewing !== latest();
const RO = () => isHistory();
// 'agent' is what json-bridge records now; 'claude' is the same thing in older trails.
const ORIGIN = { opened: 'vOpened', sent: 'vSent', agent: 'vClaude', claude: 'vClaude' };

async function refreshVersions () {
  if (!BRIDGE) return;
  try {
    const idx = await (await fetch(`${BRIDGE.history}?t=${BRIDGE.token}`)).json();
    if (!Array.isArray(idx) || !idx.length) return;
    // Only bodies that came from the server are reusable — the boot fallback's
    // v1 is the live document, which is not necessarily the server's v1.
    const cached = new Map(versions.filter(v => v.fetched).map(v => [v.n, v.json]));
    versions = idx.map(v => ({
      n: v.n, label: t(ORIGIN[v.origin] || 'vSent'), date: v.at,
      json: cached.get(v.n) || null, fetched: cached.has(v.n),
    }));
    viewing = latest();
    stash = null;
    buildTimeline();
  } catch { /* the link dot is already saying the link is down */ }
}

const dirty = () => {
  if (RO()) return;
  dirtySinceSend = true; syncSend();
};
function syncSend () {
  $('#send').disabled = !BRIDGE || !dirtySinceSend || RO();
  $('#send').textContent = t('send');
}

/* ── render ── */
/* clarifications render in the panel only — the tree carries the ✎ marker.
   The story body is the PRD's row: requirements, Gherkin acceptance criteria,
   themes, and the INVEST Definition-of-Ready. */
function gline (label, key, c, ci, ce) {
  return `<div class="gline"><span class="glbl">${label}</span><span class="gtext"
    contenteditable="${ce}" data-g="${key}" data-ph="…">${esc(c[key] || '')}</span></div>`;
}
function storyHtml (s, ei, si) {
  const ce = RO() ? 'false' : 'plaintext-only';
  const qn = (s.notes || []).length + s.crit.reduce((m, c) => m + (c.notes || []).length, 0);
  const tags = (s.themes || []).filter(th => doc.themes.includes(th));
  return `
  <article class="srow" data-i="${si}">
    <div class="shead" role="button" tabindex="0" aria-expanded="${!!s.open}" data-act="tog">
      <span class="tw">▶</span>
      <span class="ttl" contenteditable="${ce}" data-act="edit-title">${esc(s.title)}</span>
      ${tags.map(th => `<span class="stag">${esc(th)}</span>`).join('')}
      ${qn ? `<span class="qmark">✎${qn}</span>` : ''}
      <span class="count">${s.crit.length} ${t('scenarios')}</span>
      <button class="del" data-act="del">×</button>
    </div>
    <div class="sbody" ${s.open ? '' : 'hidden'}>
      <div class="col">
        <div class="sect">${t('acLbl')}</div>
        ${s.crit.map((c, ci) => `
          <div class="crow" data-c="${ci}">
            <div class="chead" role="button" tabindex="0" aria-expanded="${!!c.open}" data-act="togc">
              <span class="tw">▶</span>
              <span class="slbl">${t('scenario')}</span>
              <span class="ctext" contenteditable="${ce}" data-act="edit-scen">${esc(c.scenario || '')}</span>
            </div>
            <div class="gwt" ${c.open ? '' : 'hidden'}>
              ${gline(t('given'), 'given', c, ci, ce)}
              ${gline(t('when'), 'when', c, ci, ce)}
              ${gline(t('then'), 'then', c, ci, ce)}
              ${gline(t('andLbl'), 'and', c, ci, ce)}
            </div>
            <button class="del" data-act="delc">×</button>
          </div>`).join('')}
        <div class="acts"><button class="act" data-act="addc">${t('addScen')}</button></div>
      </div>

      <div class="col aside">
        <div class="sect">${t('noteLbl')}</div>
        <div class="snote" contenteditable="${ce}" data-act="edit-note"
             data-ph="${esc(t('notePh'))}">${esc(s.note || '')}</div>
      </div>
    </div>
  </article>`;
}

function epicHtml (ep, ei) {
  const ce = RO() ? 'false' : 'plaintext-only';
  return `
  <section class="epic" data-e="${ei}">
    <div class="ehead" role="button" tabindex="0" aria-expanded="${!!ep.open}" data-act="etog">
      <span class="tw">▶</span>
      <span class="elbl">${t('epicLbl')}</span>
      <span class="ttl" contenteditable="${ce}" data-act="edit-etitle">${esc(ep.title)}</span>
      <span class="rule"></span>
      <span class="count">${ep.stories.length} ${t('stories')}</span>
      <button class="del" data-act="edel">×</button>
    </div>
    <div class="slist" ${ep.open ? '' : 'hidden'}>
      ${ep.stories.map((s, si) => storyHtml(s, ei, si)).join('')}
      <div class="eacts"><button class="act" data-act="eaddstory">${t('addS')}</button></div>
    </div>
  </section>`;
}

/* the catalog is read-only here — Claude manages it from the conversation */
function renderThemesRow () {
  $('#themesRow').innerHTML = doc.themes.length
    ? `<span class="lbl">${esc(t('themesLbl'))}</span>` +
      doc.themes.map(th => `<span class="tpill">${esc(th)}</span>`).join('')
    : '';
}

function render () {
  document.title = (doc.title || doc.feature || 'Spec') + ' — spec · Visual Stack';
  document.body.classList.toggle('history', isHistory());
  $('#hEyebrow').textContent = t('eyebrow');
  $('#hTitle').textContent = doc.title || doc.feature || '';
  $('#hTitle').contentEditable = RO() ? 'false' : 'plaintext-only';
  $('#hGoal').textContent = doc.goal || '';
  $('#hGoal').contentEditable = RO() ? 'false' : 'plaintext-only';
  $('#hMeta').innerHTML = (doc.source || []).map(s => `<span>${esc(s)}</span>`).join(' · ');
  $('#addEpic').textContent = t('addE');
  const anyOpen = allStories().some(s => s.open);
  $('#collapse').textContent = anyOpen ? t('collapse') : t('expand');

  /* open questions live in an always-open panel — no toggle to remember */
  const qn = allStories().reduce((n, s) =>
    n + (s.notes || []).length + s.crit.reduce((m, c) => m + (c.notes || []).length, 0), 0);
  $('#panel').hidden = !qn;
  $('#panelBtn').hidden = !qn;
  if (!qn) setPanel(false);
  if (qn) renderQPanel();

  renderThemesRow();
  $('#tree').innerHTML = doc.epics.map((ep, ei) => epicHtml(ep, ei)).join('');
  syncSend();
  syncTimeline();
}

/* ── locate a note from its path "ei.si.ni" | "ei.si.ci.ni" ── */
function noteAt (path) {
  const p = path.split('.').map(Number);
  const s = doc.epics[p[0]].stories[p[1]];
  return p.length === 3 ? s.notes[p[2]] : s.crit[p[2]].notes[p[3]];
}
function spliceNote (path) {
  const p = path.split('.').map(Number);
  const s = doc.epics[p[0]].stories[p[1]];
  p.length === 3 ? s.notes.splice(p[2], 1) : s.crit[p[2]].notes.splice(p[3], 1);
}

/* ── tree events ── */
$('#tree').addEventListener('click', e => {
  const epicEl = e.target.closest('.epic');
  if (!epicEl) return;
  const ei = +epicEl.dataset.e;
  const ep = doc.epics[ei];

  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  if (act.startsWith('edit-')) return;
  const expandOnly = act === 'tog' || act === 'togc' || act === 'etog';
  if (RO() && !expandOnly) return;
  const card = e.target.closest('.srow');
  const si = card ? +card.dataset.i : null;
  const crow = e.target.closest('.crow');
  const ci = crow ? +crow.dataset.c : null;

  /* deleting anything is two-step — the first click only arms */
  if ((act === 'del' || act === 'delc' || act === 'edel') && !btn.classList.contains('armed')) {
    btn.classList.add('armed');
    btn.textContent = t('confirmDel');
    setTimeout(() => { btn.classList.remove('armed'); btn.textContent = '×'; }, 2600);
    e.stopPropagation();
    return;
  }

  if (act === 'etog') ep.open = !ep.open;
  if (act === 'edel') doc.epics.splice(ei, 1);
  if (act === 'eaddstory') {
    ep.stories.push({ id:'s'+Date.now(), title:t('newStory'), open:true, themes:[], notes:[], crit:[] });
    ep.open = true;
  }
  if (card) {
    const s = ep.stories[si];
    if (act === 'tog')  s.open = !s.open;
    if (act === 'togc') s.crit[ci].open = !s.crit[ci].open;
    if (act === 'del')  ep.stories.splice(si, 1);
    if (act === 'delc') s.crit.splice(ci, 1);
    if (act === 'addc') s.crit.push({ id:'c'+Date.now(), scenario:t('newScen'), given:'', when:'', then:'', and:'', open:true, notes:[] });
  }
  if (!expandOnly) dirty();
  e.stopPropagation();
  render();
});

$('#tree').addEventListener('input', e => {
  if (RO()) return;
  const el = e.target;
  const epicEl = el.closest('.epic'); if (!epicEl) return;
  const ep = doc.epics[+epicEl.dataset.e];
  if (el.dataset.act === 'edit-etitle') { ep.title = el.textContent.trim(); dirty(); return; }
  const card = el.closest('.srow'); if (!card) return;
  const s = ep.stories[+card.dataset.i];
  const crow = el.closest('.crow');
  if (el.dataset.act === 'edit-title') s.title = el.textContent.trim();
  else if (el.dataset.act === 'edit-scen' && crow) s.crit[+crow.dataset.c].scenario = el.textContent.trim();
  else if (el.dataset.g && crow) s.crit[+crow.dataset.c][el.dataset.g] = el.textContent.trim();
  else if (el.dataset.act === 'edit-note') s.note = el.textContent.trim();
  dirty();
});

$('#hTitle').addEventListener('input', () => { if (!RO()) { doc.title = $('#hTitle').textContent.trim(); dirty(); } });
$('#hGoal').addEventListener('input', () => { if (!RO()) { doc.goal = $('#hGoal').textContent.trim(); dirty(); } });

$('#addEpic').addEventListener('click', () => {
  if (RO()) return;
  doc.epics.push({ id:'e'+Date.now(), title:t('newEpic'), open:true, stories:[] });
  dirty(); render();
  const titles = $('#tree').querySelectorAll('.ehead .ttl');
  titles[titles.length - 1]?.focus();
});

$('#collapse').addEventListener('click', () => {
  const anyOpen = allStories().some(s => s.open);
  allStories().forEach(s => { s.open = !anyOpen; s.crit.forEach(c => c.open = false); });
  if (anyOpen) doc.epics.forEach(ep => ep.open = true);   // epics stay open; only stories fold
  render();
});

$('#panelBtn').addEventListener('click', () =>
  setPanel(!document.body.classList.contains('panelopen')));
$('#scrim').addEventListener('click', () => setPanel(false));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.body.classList.contains('panelopen')) setPanel(false);
});

/* ── the questions panel — every note, answer in place or click to jump ── */
function allNotes () {
  const out = [];
  doc.epics.forEach((ep, ei) => ep.stories.forEach((s, si) => {
    (s.notes || []).forEach((n, ni) => out.push({ n, path: `${ei}.${si}.${ni}`, ctx: `${ep.title} · ${s.title}` }));
    s.crit.forEach((c, ci) => (c.notes || []).forEach((n, ni) =>
      out.push({ n, path: `${ei}.${si}.${ci}.${ni}`, ctx: `${ep.title} · ${s.title} · ${c.scenario}` })));
  }));
  return out;
}

const otherPicked = new Set();   // clarifications answered in the reviewer's own words

/** Narrow screens only: slide the clarifications in over the spec, or away. */
function setPanel (on) {
  document.body.classList.toggle('panelopen', on);
  $('#panelBtn').setAttribute('aria-expanded', String(on));
}

function renderQPanel () {
  const items = allNotes();
  $('#qpTitle').textContent = t('qpTitle');
  $('#qpCount').textContent = items.length;
  // The button has to carry what the panel would have shown: how many
  // clarifications are still unanswered, and nothing else.
  const need = items.filter(x => !x.n.answer).length;
  const badge = $('#panelBadge');
  $('#panelBtn .lbl').textContent = t('qpTitle');
  badge.textContent = String(need || items.length || '');
  badge.classList.toggle('need', need > 0);
  $('#panelBtn').title = need ? t('qpNeed')(need) : t('qpTitle');
  $('#pbody').innerHTML = items.map(({ n, path, ctx }) => {
    const hasOpts = (n.options || []).length > 0;
    // An answer that is none of the offered ones is still an answer. "Something
    // else" is the last choice rather than a box floating beside them, so the
    // options are the whole set and picking one is picking from all of it.
    const freeVal = n.answer && (!hasOpts || !n.options.includes(n.answer)) ? n.answer : '';
    // "picked but not yet typed" is a state of the page, not of the spec — it
    // would be a meaningless key in the JSON Claude reads back.
    const otherOn = !hasOpts || !!freeVal || otherPicked.has(path);
    const opts = hasOpts && !RO()
      ? `<span class="opts">${n.options.map((o, oi) =>
          `<button class="opt ${n.answer === o ? 'picked' : ''}" data-oi="${oi}"><span class="rad"></span>${esc(o)}</button>`).join('')
        }<button class="opt other ${otherOn ? 'picked' : ''}" data-other="1"><span class="rad"></span>${esc(t('qpOther'))}</button></span>`
      : '';
    const freeAns = RO() || (hasOpts && !otherOn) ? '' :
      `<span class="qans" contenteditable="plaintext-only" data-ph="${esc(t('qpAnswerPh'))}">${esc(freeVal)}</span>`;
    return `<div class="item" data-jump="${esc(path)}">
        <div class="ih"><span class="n">?</span>
          <span class="kind">${esc(ctx)}</span>
          <button class="ikill" title="${esc(t('qpDismiss'))}">×</button></div>
        <div class="note2">${esc(n.text || '—')}</div>
        ${opts}${freeAns}
      </div>`;
  }).join('');
}

$('#pbody').addEventListener('click', e => {
  const item = e.target.closest('[data-jump]'); if (!item) return;
  const opt = e.target.closest('.opt');
  if (opt) {
    if (RO()) return;
    const note = noteAt(item.dataset.jump);
    if (opt.dataset.other) {
      // Picking "something else" drops whichever option was chosen and hands
      // the cursor to the box, so answering is one action, not two.
      otherPicked.add(item.dataset.jump);
      note.answer = null;
      dirty(); render();
      requestAnimationFrame(() => {
        $('#pbody').querySelector(`[data-jump="${item.dataset.jump}"] .qans`)?.focus();
      });
      return;
    }
    otherPicked.delete(item.dataset.jump);
    const picked = note.options[+opt.dataset.oi];
    note.answer = note.answer === picked ? null : picked;
    dirty(); render();
    return;
  }
  if (e.target.closest('.ikill')) {
    if (RO()) return;
    spliceNote(item.dataset.jump);
    dirty(); render();
    return;
  }
  if (e.target.closest('.qans')) return;   // typing an answer, not jumping
  const p = item.dataset.jump.split('.').map(Number);
  const ep = doc.epics[p[0]], s = ep.stories[p[1]];
  ep.open = true; s.open = true;
  if (p.length === 4) s.crit[p[2]].open = true;
  setPanel(false);   // on a narrow screen the drawer is over the thing we jump to
  render();
  requestAnimationFrame(() => {
    const row = $('#tree').querySelector(`.epic[data-e="${p[0]}"] .srow[data-i="${p[1]}"]`);
    if (row) {
      row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      row.classList.add('hilite');
      setTimeout(() => row.classList.remove('hilite'), 1800);
    }
  });
});

$('#pbody').addEventListener('input', e => {
  if (RO()) return;
  const ans = e.target.closest('.qans'); if (!ans) return;
  noteAt(ans.closest('[data-jump]').dataset.jump).answer = ans.textContent.trim() || null;
  dirty();
});

/* ── version timeline — the shell's scrubber, over spec snapshots ── */
const vAt = n => versions.find(v => v.n === n);
const whenOf = v => {
  const dt = v?.date ? new Date(v.date) : null;
  return dt ? dt.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) + ' ' +
    dt.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }) : '';
};
function buildTimeline () {
  VSScrub.set({
    items: versions.map(v => ({
      id: v.n, cap: `v${v.n}`, label: v.label,
      sub: whenOf(v) + (v.n === latest() ? ' · ' + t('current') : ''),
    })),
    active: viewing,
  });
  syncTimeline();
}
function syncTimeline () {
  VSScrub.set({ active: viewing });
  $('#histBanner').classList.toggle('on', isHistory());
  $('#histText').textContent = t('viewingOld')(viewing);
  $('#btnNow').textContent = t('backToNow');
}
async function gotoVersion (n) {
  const v = vAt(n);
  if (!v || n === viewing) { syncTimeline(); return; }
  const my = ++navSeq;
  if (!isHistory()) stash = JSON.stringify(doc);   // leaving the live document
  if (n === latest() && stash) {                   // …and coming back to it
    doc = migrate(JSON.parse(stash)); stash = null;
  } else {
    if (!v.json && BRIDGE) {
      try {
        v.json = JSON.stringify(await (await fetch(`${BRIDGE.history}/${n}?t=${BRIDGE.token}`)).json());
        v.fetched = true;
      } catch { syncTimeline(); return; }
    }
    if (my !== navSeq || !v.json) return;          // scrubbed past while it loaded
    doc = migrate(JSON.parse(v.json));
  }
  viewing = n;
  render();
}
$('#btnNow').addEventListener('click', () => gotoVersion(latest()));
VSScrub.mount({ onPick: gotoVersion });

/* ── language — the switch is the shell's; this is what the spec does about it ── */
VSShell.onLang(l => {
  LANG = l;                // the link dot is the shell's; it repaints itself
  if (!doc) return;        // the shell announces the language before boot loads one
  if (pendingPush) offerRefresh();
  buildTimeline();
  render();
});

function offerRefresh () {
  $('#workText').textContent = t('refreshed');
  $('#rbApply').textContent = t('apply');
  $('#rbDismiss').textContent = t('dismiss');
  $('#workBanner').classList.add('on');
}
/* Applying is a choice to take Claude's document over yours — anything edited
   since the last Send goes with it. The server already recorded this version
   when it pushed; dismissing leaves the page on its own copy and the timeline
   picks the update up on the next refresh. */
$('#rbApply').addEventListener('click', async () => {
  if (pendingPush) {
    doc = migrate(pendingPush); pendingPush = null; dirtySinceSend = false;
    await refreshVersions();
  }
  $('#workBanner').classList.remove('on');
  render();
});
$('#rbDismiss').addEventListener('click', () => { $('#workBanner').classList.remove('on'); });

$('#send').addEventListener('click', async () => {
  if (!BRIDGE || RO()) return;
  $('#send').disabled = true;
  try {
    const r = await fetch(BRIDGE.save, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-VSTACK-Token': BRIDGE.token },
      body: JSON.stringify(doc),
    });
    if (!r.ok) throw new Error(r.status);
    dirtySinceSend = false;
    await refreshVersions();
    $('#send').textContent = t('sent');
    setTimeout(syncSend, 1600);
  } catch { $('#send').disabled = false; }
});

/* ── boot ── */
(async function boot () {
  VSShell.init({ name: 'Spec', eyebrow: BRIDGE ? BRIDGE.name : '', send: true });
  if (BRIDGE) VSShell.setLink(false, undefined, BRIDGE.watching); else VSShell.hideLink();
  if (BRIDGE) {
    try {
      doc = migrate(await (await fetch(`${BRIDGE.doc}?t=${BRIDGE.token}`)).json());
    } catch { doc = migrate(JSON.parse($('#fallback').textContent)); }
    // The shell owns the socket and the dot — including `presence`; the page
    // only hears about its own `push`.
    VSShell.connect({
      url: `${BRIDGE.events}?t=${BRIDGE.token}`,
      on: {
        push: ev => {
          try { pendingPush = JSON.parse(ev.data) } catch { return }
          offerRefresh();
        },
      },
    });
  } else {
    doc = migrate(JSON.parse($('#fallback').textContent));
  }
  versions = [{ n: 1, label: t('vOpened'), date: new Date().toISOString(), json: JSON.stringify(doc) }];
  viewing = 1;
  buildTimeline();
  render();
  await refreshVersions();   // the trail from earlier rounds, if there is one
  render();
})();
</script>
