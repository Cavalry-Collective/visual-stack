    addHint: ['Add a workflow, such as Book a demo', '添加流程，例如“预约演示”'],
    removed: ['Removed {name}.', '已删除“{name}”。'],
    redrawing: ['{agent} is redrawing the workflows…', '{agent} 正在重画流程…'],
    allDone: ['All {what} reviewed', '{what}全部评审完毕'],
    writing: ['{agent} is writing your report.', '{agent} 正在撰写报告。'],
    stopped: ['Stopped.', '已停止。'],
    retry: ['Retry', '重试'],
    offline: ['Start the review from {agent} first.', '请先在 {agent} 中开始评审。'],
    notSent: ['Not sent. Try again.', '未发送，请重试。'],
    expand: ['Show what is inside', '展开']
  }
  var t = function (key) { return fill(STR[key][lang() === 'zh' ? 1 : 0]) }
  var textOf = function (text) {
    if (text && typeof text === 'object') return text[lang()] || text.en || text.zh || ''
    return String(text || '')
  }
  var counted = function (n, one, many) { return n + (lang() === 'zh' ? '' : ' ') + t(n === 1 ? one : many) }

  var KINDS = ['page', 'modal', 'popup', 'panel']
  var STATUSES = ['queued', 'running', 'done', 'failed']
  var doc = { decisions: {}, overall: '', revised: {} }
  var chosen = null
  var open = {}
  var tab = null
  var steering = null
  var edits = { steer: {}, add: [] }
  /* Without hover, or without room beside the map, there is no preview panel, so an opened row shows its picture instead. */
  var inline = window.matchMedia('(hover: none), (max-width: 860px)')

  var screensOf = function () { return doc.sitemap && Array.isArray(doc.sitemap.screens) ? doc.sitemap.screens : [] }
  var flowsOf = function () { return doc.sitemap && Array.isArray(doc.sitemap.workflows) ? doc.sitemap.workflows : [] }
  var walk = function (list, visit) {
    list.forEach(function (screen) {
      visit(screen)
      if (Array.isArray(screen.children)) walk(screen.children, visit)
    })
  }
  var allScreens = function () { var out = []; walk(screensOf(), function (screen) { out.push(screen) }); return out }
  var findScreen = function (id) { return allScreens().filter(function (screen) { return screen.id === id })[0] || null }
  var findFlow = function (id) { return flowsOf().filter(function (flow) { return flow.id === id })[0] || null }
  var kindOf = function (screen) { return KINDS.indexOf(screen.kind) !== -1 ? screen.kind : 'page' }
  var started = function () { return Array.isArray(doc.exclude) }
  var stepsOf = function (flow) { return Array.isArray(flow.steps) ? flow.steps : [] }

  /* What the owner chose to cover on the start page. A review asked for in chat as `true` covers both. */
  var cover = function () { return ['pages', 'workflows'].indexOf(doc.indepth) !== -1 ? doc.indepth : 'both' }
  var hasPages = function () { return cover() !== 'workflows' && allScreens().length > 0 }
  var hasFlows = function () { return cover() !== 'pages' }
  var stepList = function () { return (hasPages() ? ['screens'] : []).concat(hasFlows() ? ['flows'] : []) }
  var tabNow = function () { var list = stepList(); return list.indexOf(tab) !== -1 ? tab : list[0] || 'screens' }

  /* Everything starts included, except what the agent marks off from a past round.
     Once the review starts, the answers file says what was left out. */
  var excludedNow = function () {
    if (!started()) {
      if (!chosen) {
        chosen = {}
        allScreens().concat(flowsOf()).forEach(function (item) { if (item.off === true) chosen[item.id] = true })
      }
      return chosen
    }
    var out = {}
    doc.exclude.forEach(function (id) { out[id] = true })
    return out
  }
  var reviewedScreens = function () { var off = excludedNow(); return hasPages() ? allScreens().filter(function (screen) { return !off[screen.id] }) : [] }
  var reviewedFlows = function () { var off = excludedNow(); return hasFlows() ? flowsOf().filter(function (flow) { return !off[flow.id] }) : [] }
  var statusOf = function (item) { return STATUSES.indexOf(item.status) !== -1 ? item.status : 'queued' }

  /* Steers and new workflows wait for the agent to redraw them. Until it does, the answers file holds them. */
  var sentEdits = function () { var held = doc.workflowEdits; return held && typeof held === 'object' ? held : null }
  var editCount = function () { return Object.keys(edits.steer).length + edits.add.length }

  /* Something that finished since the last paint gets its moment. */
  var lastStatus = {}
  var justDone = {}
  var noteStatuses = function () {
    justDone = {}
    allScreens().concat(flowsOf()).forEach(function (item) {
      if (item.status === 'done' && lastStatus[item.id] && lastStatus[item.id] !== 'done') justDone[item.id] = true
      lastStatus[item.id] = item.status || 'queued'
    })
  }

  var tick = '<svg class="tick" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9"/><path d="M6 10.5l2.6 2.6L14 7.5"/></svg>'
  var trash = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4h11M6.5 4V2.5h3V4M4 4l.7 9.5h6.6L12 4"/></svg>'
  var statusHtml = function (item, excluded) {
    if (excluded) return '<span class="status">' + esc(t('off')) + '</span>'
    var status = statusOf(item)
    var label = t(status)
    if (status === 'done' && typeof item.found === 'number') label += ' · ' + t('found').replace('{n}', item.found)
    return '<span class="status ' + status + '">' + (status === 'done' ? tick : '') + esc(label) + '</span>'
  }

  var nodeHtml = function (screen, off) {
    var kind = kindOf(screen)
    var kids = Array.isArray(screen.children) ? screen.children : []
    var pictured = inline.matches && !!screen.shot
    /* A page opens by default to show what sits under it; its picture waits until the owner opens it. */
    var shot = pictured && open[screen.id] === true ? screen.shot : ''
    var expandable = kids.length > 0 || pictured
    var isOpen = expandable && (open[screen.id] !== undefined ? open[screen.id] : kids.length > 0)
    var excluded = !!off[screen.id]
    var name = textOf(screen.title) || screen.id
    var status = started() && !excluded ? statusOf(screen) : ''
    var right = started() ? statusHtml(screen, excluded)
      : '<button class="switch" type="button" role="switch" aria-label="' + esc(t('review') + ' ' + name) + '" aria-checked="' + String(!excluded) + '" data-for="' + esc(screen.id) + '"><span class="track"><span class="knob"></span></span></button>'
    var count = typeof screen.count === 'number' && screen.count > 1 ? screen.count : 0
    return '<li class="node' + (excluded ? ' off' : '') + (isOpen ? ' open' : '') + '" data-id="' + esc(screen.id) + '">' +
      '<div class="row' + (status ? ' ' + status : '') + (justDone[screen.id] ? ' just' : '') + '" data-screen="' + esc(screen.id) + '">' +
        '<button class="chev' + (expandable ? '' : ' none') + '" type="button" aria-label="' + esc(t('expand')) + '" aria-expanded="' + String(isOpen) + '"' + (expandable ? '' : ' tabindex="-1"') + '><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M3 1.5 7 5 3 8.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
        '<button class="name" type="button" tabindex="-1">' +
          '<span class="kind k-' + kind + '"><i></i>' + esc(t(kind)) + '</span>' +
          '<span class="title">' + esc(name) + '</span>' +
          (count ? '<span class="alike" title="' + esc(t('alikeTitle').replace('{n}', count)) + '">' + esc(t('alike').replace('{n}', count)) + '</span>' : '') +
        '</button>' +
        right +
      '</div>' +
      (shot ? '<div class="detail"><img src="' + esc(shot) + '" alt=""></div>' : '') +
      (kids.length ? '<ul>' + kids.map(function (kid) { return nodeHtml(kid, off) }).join('') + '</ul>' : '') +
      '</li>'
  }

  /* A workflow is a journey across screens: its steps read left to right, and the step being
     walked carries the beam. Before the review the owner steers it or removes it. */
  var flowHtml = function (flow, off) {
    var name = textOf(flow.title) || flow.id
    var status = started() ? statusOf(flow) : ''
    var steps = stepsOf(flow)
    var at = typeof flow.at === 'number' ? flow.at : -1
    var held = sentEdits()
    var note = edits.steer[flow.id] || (held && held.steer && held.steer[flow.id])
    var chips = steps.map(function (step, index) {
      var screen = findScreen(step.screen)
      var kind = screen ? kindOf(screen) : 'page'
      var state = status === 'done' || (status === 'running' && index < at) ? ' passed' : status === 'running' && index === at ? ' at' : status === 'failed' && index === at ? ' broke' : ''
      return (index ? '<span class="arrow" aria-hidden="true">→</span>' : '') +
        '<span class="chip k-' + kind + state + '" data-screen="' + esc(step.screen || '') + '" title="' + esc(textOf(step.action)) + '"><i></i>' + esc(screen ? textOf(screen.title) || screen.id : step.screen || '') + '</span>'
    }).join('')
    var right
    if (started()) right = statusHtml(flow, false)
    else if (note) right = held ? '' : '<span class="fx"><button class="link" type="button" data-undo="' + esc(flow.id) + '">' + esc(t('undo')) + '</button></span>'
    else right = '<span class="fx"><button class="link" type="button" data-steer="' + esc(flow.id) + '">' + esc(t('steer')) + '</button><button class="trash" type="button" aria-label="' + esc(t('remove') + ' ' + name) + '" data-remove="' + esc(flow.id) + '">' + trash + '</button></span>'
    var where = status === 'running' && at >= 0 ? '<span class="where">' + esc(t('step').replace('{n}', at + 1).replace('{total}', steps.length)) + '</span>' : ''
    var sub = note ? t('steered').replace('{note}', note) : textOf(flow.goal)
    var box = steering === flow.id ? '<form class="steer-box" data-steer-form="' + esc(flow.id) + '"><input aria-label="' + esc(t('steerHint')) + '" placeholder="' + esc(t('steerHint')) + '" autocomplete="off"><button class="btn" type="submit">' + esc(t('send')) + '</button></form>' : ''
    return '<li class="flow' + (note ? ' revising' : '') + (status ? ' ' + status : '') + (justDone[flow.id] ? ' just' : '') + '" data-id="' + esc(flow.id) + '">' +
      '<div class="flow-head"><div class="flow-name"><b>' + esc(name) + '</b>' + (sub ? '<span>' + esc(sub) + '</span>' : '') + '</div>' + where + right + '</div>' +
      box + '<div class="steps">' + chips + '</div>' +
      '</li>'
  }
  var addedHtml = function (text, index, held) {
    return '<li class="flow new"><div class="flow-head"><div class="flow-name"><b>' + esc(text) + '</b><span>' + esc(t('added')) + '</span></div>' +
      (held ? '' : '<span class="fx"><button class="trash" type="button" aria-label="' + esc(t('remove') + ' ' + text) + '" data-unadd="' + index + '">' + trash + '</button></span>') + '</div></li>'
  }

  /* The first paint lands the rows one after another, with the red block running down the tree. */
  var arrived = false
  var paintLists = function () {
    noteStatuses()
    var off = excludedNow()
    var tree = $('#tree')
    tree.innerHTML = screensOf().map(function (screen) { return nodeHtml(screen, off) }).join('')
    var held = sentEdits()
    var shown = flowsOf().filter(function (flow) { return !off[flow.id] })
    var adds = held && Array.isArray(held.add) ? held.add.map(function (text, index) { return addedHtml(text, index, true) }) : edits.add.map(function (text, index) { return addedHtml(text, index, false) })
    $('#flows').innerHTML = shown.map(function (flow) { return flowHtml(flow, off) }).join('') + adds.join('')
    $('#addFlow').hidden = started() || !!held
    var focusBox = steering && $('[data-steer-form="' + steering + '"] input')
    if (focusBox) focusBox.focus()
    var rows = $$('.row', tree)
    /* A repaint while the rows are still landing keeps their order, so they stay staggered. */
    rows.forEach(function (row, index) { row.style.setProperty('--i', index) })
    if (arrived || !rows.length || tabNow() !== 'screens') return
    arrived = true
    tree.style.setProperty('--n', rows.length)
    tree.style.setProperty('--h', Math.max(0, tree.offsetHeight - 40) + 'px')
    tree.classList.add('arrive')
    setTimeout(function () { tree.classList.remove('arrive') }, rows.length * 30 + 800)
  }

  /* Pages first, then workflows. With one of them covered, there is a single step and no step bar. */
  var paintSteps = function () {
    var list = stepList()
    var now = tabNow()
    $('#stepsBar').hidden = list.length < 2
    $('#mapHead').hidden = list.length < 2
    $$('#stepsBar button').forEach(function (button, index) {
      var on = button.dataset.tab === now
      button.setAttribute('aria-current', on ? 'step' : 'false')
      button.disabled = !started() && !on
      button.classList.toggle('past', !started() && list.indexOf(button.dataset.tab) < list.indexOf(now))
    })
    $('#tree').hidden = now !== 'screens'
    $('#flowStep').hidden = now !== 'flows'
    $('#mapTitle').textContent = started() ? t('reviewing') : now === 'flows' ? t('pickFlows') : t('pickPages')
  }
  var goTo = function (next) {
    var list = stepList()
    var from = list.indexOf(tabNow())
    tab = next
    steering = null
    render()
    var entering = next === 'flows' ? $('#flowStep') : $('#tree')
    entering.style.setProperty('--from', list.indexOf(next) < from ? '-28px' : '28px')
    entering.classList.remove('enter')
    void entering.offsetWidth
    entering.classList.add('enter')
  }

  var whatOf = function (screens, flows) {
    var parts = []
    if (screens) parts.push(counted(screens, 'page1', 'pagesN'))
    if (flows) parts.push(counted(flows, 'flow1', 'flowsN'))
    return parts.join(t('and'))
  }

  var paintPlan = function () {
    var screens = reviewedScreens(), flows = reviewedFlows()
    var n = screens.length + flows.length
    var total = (hasPages() ? allScreens().length : 0) + (hasFlows() ? flowsOf().length : 0)
    var excluded = total - n
    var items = screens.concat(flows)
    var done = items.filter(function (item) { return item.status === 'done' || item.status === 'failed' }).length
    var finished = started() && n > 0 && done === n
    var list = stepList(), now = tabNow()
    var lastStep = list.indexOf(now) === list.length - 1
    var pendingEdits = editCount()
    var redrawing = !started() && !!sentEdits()
    $('#includeAll').hidden = started() || !excluded || now !== 'screens'
    if (started()) $('#tally').textContent = t('progress').replace('{done}', done).replace('{total}', n)
    else $('#tally').textContent = ''
    $('#tally').hidden = !$('#tally').textContent
    $('#tallySub').textContent = redrawing ? '' : pendingEdits ? t('edits').replace('{n}', pendingEdits) : excluded ? t('excluded').replace('{n}', excluded) : ''
    $('#bar').hidden = !started() || finished
    $('#barFill').style.width = (n ? done / n * 100 : 0) + '%'
    $('#count').hidden = finished || (!$('#tally').textContent && !$('#tallySub').textContent)
    var waitingText = redrawing ? t('redrawing') : t('waiting')
    $('#waiting').hidden = !(redrawing || (started() && !finished && !items.some(function (item) { return item.status })))
    $('#waiting span:last-child').textContent = waitingText
    $('#next').hidden = started() || lastStep
    $('#next').textContent = t('next')
    $('#back').hidden = started() || list.indexOf(now) === 0
    $('#back').textContent = t('back')
    var startButton = $('#start')
    startButton.hidden = started() || !lastStep || redrawing
    startButton.disabled = !pendingEdits && n === 0
    startButton.textContent = pendingEdits ? t('update') : n === 0 ? t('pickOne') : t('start').replace('{what}', whatOf(screens.length, flows.length))
    $('#alldone').hidden = !finished
    $('#alldoneTitle').textContent = t('allDone').replace('{what}', whatOf(screens.length, flows.length))
    $('#alldoneSub').textContent = t('writing')
  }

  /* The preview has one fixed place beside the map, and keeps the last screen shown. */
  var docked = null
  var showDock = function (screen, quiet) {
    var dock = $('#dock')
    dock.hidden = false
    if (docked === screen.id) return
    docked = screen.id
    $('img', dock).src = screen.shot
    $('.cap b', dock).textContent = textOf(screen.title) || screen.id
    $('.cap span', dock).textContent = screen.path || ''
    dock.classList.remove('swap')
    if (quiet) return
    void dock.offsetWidth
    dock.classList.add('swap')
  }
  var paintDock = function () {
    var shown = docked ? findScreen(docked) : null
    var first = shown && shown.shot ? shown : allScreens().filter(function (screen) { return screen.shot })[0]
    if (!first) { $('#dock').hidden = true; return }
    docked = null
    showDock(first, true)
  }

  var render = function () {
    $$('[data-t]').forEach(function (el) { el.textContent = t(el.dataset.t) })
    $('#addInput').placeholder = t('addHint')
    window.VSShell.name(t('tool'))
    document.title = 'Visual Stack ' + t('tool')
    var problem = typeof doc.problem === 'string' ? doc.problem.trim() : ''
    $('#problem').hidden = !problem
    $('#problem p span').textContent = problem
    paintSteps()
    paintLists()
    paintPlan()
    paintDock()
    window.VSShell.rail(started() ? 3 : 2, started() && $('#alldone').hidden)
  }

  /* Switching a page switches everything under it; a modal or panel can then be switched on its own. */
  var setIncluded = function (id, on) {
    if (started()) return
    var next = Object.assign({}, excludedNow())
    var targets = []
    walk([findScreen(id)], function (screen) { targets.push(screen) })
    targets.forEach(function (item) { if (on) delete next[item.id]; else next[item.id] = true })
    chosen = next
    paintLists()
    paintPlan()
  }

  $('#tree').addEventListener('click', function (event) {
    var toggle = event.target.closest('.switch[data-for]')
    if (toggle) { setIncluded(toggle.dataset.for, toggle.getAttribute('aria-checked') !== 'true'); return }
    var node = event.target.closest('.node')
    if (!node || !event.target.closest('.chev, .name')) return
    if ($('.chev', node).classList.contains('none')) return
    open[node.dataset.id] = !node.classList.contains('open')
    paintLists()
  })
  $('#flows').addEventListener('click', function (event) {
    var button = event.target.closest('button')
    if (!button || started()) return
    if (button.dataset.steer) { steering = steering === button.dataset.steer ? null : button.dataset.steer; paintLists(); return }
    if (button.dataset.undo) { delete edits.steer[button.dataset.undo]; paintLists(); paintPlan(); return }
    if (button.dataset.unadd !== undefined) { edits.add.splice(Number(button.dataset.unadd), 1); paintLists(); paintPlan(); return }
    if (button.dataset.remove) {
      var flow = findFlow(button.dataset.remove)
      var next = Object.assign({}, excludedNow())
      next[flow.id] = true
      chosen = next
      paintLists()
      paintPlan()
      window.VSShell.toast(t('removed').replace('{name}', textOf(flow.title) || flow.id))
    }
  })
  $('#flows').addEventListener('submit', function (event) {
    var form = event.target.closest('[data-steer-form]')
    if (!form) return
    event.preventDefault()
    var note = $('input', form).value.trim()
    if (!note) return
    edits.steer[form.dataset.steerForm] = note
    steering = null
    paintLists()
    paintPlan()
  })
  $('#flows').addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && steering) { steering = null; paintLists() }
  })
  $('#addFlow').addEventListener('submit', function (event) {
    event.preventDefault()
    var text = $('#addInput').value.trim()
    if (!text) return
    edits.add.push(text)
    $('#addInput').value = ''
    paintLists()
    paintPlan()
  })
  $('#includeAll').addEventListener('click', function () {
    var next = Object.assign({}, excludedNow())
    allScreens().forEach(function (screen) { delete next[screen.id] })
    chosen = next
    paintLists()
    paintPlan()
  })
  $('#stepsBar').addEventListener('click', function (event) {
    var button = event.target.closest('[data-tab]')
    if (button && !button.disabled) goTo(button.dataset.tab)
  })
  $('#next').addEventListener('click', function () { goTo('flows') })
  $('#back').addEventListener('click', function () { goTo('screens') })

  /* Resting the pointer on a row, or on a workflow step, shows that screen in the preview. */
  var peeked = null
  var onPeek = function (event) {
    if (event.pointerType === 'touch') return
    var target = event.target.closest('[data-screen]')
    if (!target || target === peeked) return
    var screen = findScreen(target.dataset.screen)
    if (!screen || !screen.shot) return
    if (peeked) peeked.classList.remove('peek')
    peeked = target
    target.classList.add('peek')
    showDock(screen)
  }
  var onLeave = function () { if (peeked) peeked.classList.remove('peek'); peeked = null }
  ;['#tree', '#flows'].forEach(function (list) {
    $(list).addEventListener('pointerover', onPeek)
    $(list).addEventListener('pointerleave', onLeave)
  })

  var post = function (path, body) {
    return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-VSTACK-Token': BRIDGE.token }, body: JSON.stringify(body) })
      .then(function (response) { if (!response.ok) throw new Error(String(response.status)); return response.json() })
  }
  var sending = false
  var send = function (patch, after) {
    if (!BRIDGE) { window.VSShell.toast(t('offline'), 3200); return }
    if (sending) return
    sending = true
    var next = Object.assign({}, doc, patch)
    post(BRIDGE.save, next).then(function () {
      doc = next
      if (after) after()
      render()
    }, function () {
      window.VSShell.toast(t('notSent'))
    }).then(function () { sending = false })
  }
  $('#start').addEventListener('click', function () {
    if (editCount()) {
      send({ workflowEdits: { steer: Object.assign({}, edits.steer), add: edits.add.slice() } }, function () { edits = { steer: {}, add: [] } })
      return
    }
    if (!reviewedScreens().length && !reviewedFlows().length) return
    var off = excludedNow()
    var skipped = (hasPages() ? [] : allScreens()).concat(hasFlows() ? [] : flowsOf())
    send({ exclude: allScreens().concat(flowsOf()).filter(function (item) { return off[item.id] || skipped.indexOf(item) !== -1 }).map(function (item) { return item.id }) })
  })
  $('#retry').addEventListener('click', function () { send({ problem: '', retry: true }) })

  /* The agent redraws workflows and ticks off each screen and workflow in the answers file,
     then writes the report over this page. */
  var onPush = function (next) {
    if (!next || typeof next !== 'object') return
    var toReport = doc.stage !== 'report' && next.stage === 'report'
    doc = next
    if (toReport) { location.reload(); return }
    render()
  }

  var start = function () {
    window.VSShell.init({ name: t('tool'), onLang: render })
    if (inline.addEventListener) inline.addEventListener('change', paintLists)
    render()
    if (BRIDGE) {
      window.VSShell.setLink(false, null, BRIDGE.watching)
      window.VSShell.connect({
        url: BRIDGE.events + '?t=' + encodeURIComponent(BRIDGE.token),
        on: { push: function (event) { try { onPush(JSON.parse(event.data)) } catch (e) {} } }
      })
    } else window.VSShell.hideLink()
  }
  if (BRIDGE) {
    fetch(BRIDGE.doc + '?t=' + encodeURIComponent(BRIDGE.token))
      .then(function (response) { return response.json() })
      .then(function (loaded) { if (loaded && typeof loaded === 'object') doc = loaded }, function () {})
      .then(start)
  } else start()
})()
</script>
</body>
</html>
