const API = BASE + '/api';

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const uid = () => 'c' + Math.random().toString(36).slice(2, 8);

/* One severity: everything the reviewer writes is something to do. The mark
   colour is the accent, and nothing on screen has to be decoded. */
const MARK = 'var(--brand)';
/* A comment that has been dealt with is drawn in the same colour everywhere it
   appears — mark, list card, composer. Each of those sets `--mk` once and every
   part it is made of picks the colour up from there. */
const MARK_DONE = 'var(--ok)';
const markColour = a => isClosed(a) ? MARK_DONE : MARK;

  id: 'claude', name: 'Claude',
  capabilities: { share: 'artifact', watch: 'stream', browser: true, updateDetect: 'claude-install' },
};
const agentName = () => HOST.name || 'agent';
const canShareArtifact = () => HOST.capabilities?.share === 'artifact';

const fillAgent = s => String(s ?? '').replaceAll('{agent}', agentName());
const T = k => {
  const v = STR[LANG]?.[k] ?? STR.en[k];
  if (typeof v === 'function') return (...args) => fillAgent(v(...args));
  return fillAgent(v);
};

  // Deleted in this tab — never to be folded back in by a refresh.
  forgotten: new Set(),
  // Replies taken back in this tab, by thread key, for the same reason.
  retracted: new Set(),
  pendingUpdate: null,
  linked: null,   // null until the connection has actually said one way or other
  // The shareable Artifact: asked for here, published by Claude, link comes back.
  share: { url: null, version: null, pending: false },
  doneOpen: false,        // the Addressed group, which starts folded
  // Live review only: the app's origin, where the frame starts, and which route
  // it is showing right now. A comment belongs to the route it was made on.
  app: null, startPath: '/', route: null,
  // The frame followed a link off the site: another origin, nothing readable.
  offsite: false,
};
const isHistory = () => S.viewing !== S.version;
/** The frame holds a running app, not a file we published. */
const live = () => S.runtime === 'live';
/** There is a session on the other end: it can be sent to and replied to. */
const served = () => S.runtime === 'local' || S.runtime === 'live';

/* ─────────────────────────── boot ─────────────────────────── */

async function boot () {
  const inline = JSON.parse($('#bundle').textContent || 'null');
  let data = inline;
  if (!data) {
    try { data = await (await fetch(API + '/project')).json() }
    catch {
      document.body.innerHTML = '<div class="empty" style="padding:80px">Could not reach the review server.<br>Start it with <code>node review-server.mjs serve --file &lt;page.html&gt;</code>.</div>';
      return;
    }
  }
  S.runtime = data.mode || (inline ? 'artifact' : 'local');
  S.name = data.name || 'Wireframe';
  S.fileName = data.fileName || 'page.html';
  S.html = data.html || '';
  S.versions = data.versions || [];
  S.comments = data.comments || [];
  S.version = S.viewing = data.currentVersion || 1;
  S.historyClearedAt = data.historyClearedAt || null;
  S.app = data.app || null;
  S.startPath = data.startPath || '/';
  if (live()) S.route = S.startPath;
  adoptShare(data);
  VSShell.setWatching(data.watching);
  noteWatching(data.watching);
  VSShell.setServerVersion(data.version);

  const phase = S.runtime === 'phase';
  /* Work in flight belongs to the review, not to the tab that started it. Each
     comment carries whether it has been sent and whether Claude has been handed
     it, so a reload — or a second tab — picks the progress back up instead of
     showing a workspace where nothing ever happened. */
  loadAnnotations();
  // Review is the whole product for now, so the word beside the mark says the
  // product rather than which of one tool you are in. Which page you are on is
  // already on the window below, twice. Phase preview is a different tool and
  // still names itself.
  VSShell.init({ name: phase ? 'Phase preview' : 'Visual Stack' });
  measureChrome();
  document.title = S.name + (phase ? ' — Phases' : ' — Review') + ' · Visual Stack';
  $('#urlBar').textContent = live() ? S.route : S.fileName;
  LANG = VSShell.lang;
  buildSizes(); wireChrome(); wireComposer(); buildTimeline(); applyLang();
  if (live()) enterLiveMode();
  if (phase) enterPhaseMode(); else setMode('annotate');
  loadFrame(); render();
  if (served()) liveReload();
}

/* Everything the panel says about a comment is read off the comment. A comment
   is open or closed; two timestamps say where it has got to between the
   reviewer and Claude. Nothing here is remembered separately, so a reload and a
   second tab see the same review as the tab that wrote it. */
const isClosed = a => a.state === 'closed';
const isOpen = a => !isClosed(a);
/** Let go of by the reviewer: it is Claude's to answer, and its words are set. */
const sent = a => !!a.sentAt;
/** Written and released, but Claude has not been handed it yet. */
const isQueued = a => !!a.sentAt && !a.deliveredAt;
/** In Claude's hands: it went out with a delivery and has not come back closed. */
const isWorking = a => !!a.deliveredAt && isOpen(a);
/** Claude spoke last and nobody has answered — the one state that waits on you. */
const awaitsReply = a => isOpen(a) && isAgent((a.replies || []).at(-1)?.by);

function loadAnnotations () {
  const local = S.runtime === 'artifact' ? lsGet() : null;
  S.ann = (local ?? S.comments ?? []).map(normalise);
  // Anything Claude has said back is waiting on you: open the thread so the
  // words are visible and the box to answer in is already there.
  for (const a of S.ann) if (awaitsReply(a)) S.threadOpen.add(a.id);
}
// state: open (still to be dealt with) · closed (Claude says it is done).
// Only Claude closes one; answering a closed one puts it back to open.
const normalise = a => ({ state: 'open', note: '', size: 'desktop', replies: [], sentAt: null, deliveredAt: null, ...a });
const lsKey = () => `vstack:review:${S.fileName}:v${S.version}`;
const lsGet = () => { try { return JSON.parse(localStorage.getItem(lsKey())) } catch { return null } };

let saveTimer = null;
function save () {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    // A comment being composed is not feedback yet — it never leaves the tab
    // until it has words, so closing the browser mid-thought leaves no trace.
    const real = S.ann.filter(hasSubstance);
    if (S.runtime === 'artifact') { try { localStorage.setItem(lsKey(), JSON.stringify(real)) } catch {} ; return }
    try {
      // The server keeps what this tab is not allowed to change: a comment
      // already sent keeps its words, and only the thread grows on it.
      await fetch(API + '/comments', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ comments: real }),
      });
    } catch {}
  }, 700);
}

/** Claude edits the file while it is open here. Never swap the page out from
    under the reviewer — announce it, let them pick the moment. */
function liveReload () {
  // The shell owns the socket-to-dot translation, `presence` included; this
  // page only hears about its own `reload` events and remembers the link
  // state for its own logic.
  VSShell.connect({
    url: API + '/events',
    onLink: up => { S.linked = up },
    on: {
      reload: onReloadEvent,
      // The strip needs the same fact as the dot: a queued round with nobody
      // listening reads "not picked up yet", and no reload event carries that.
      presence: ev => {
        let watching;
        try { watching = JSON.parse(ev.data).watching } catch { return }
        if (!noteWatching(watching)) return;
        renderWork();
      },
    },
  });
}
async function onReloadEvent () {
  let data;
  try { data = await (await fetch(API + '/project')).json() } catch { return }
  // The link can land on its own, without the page or the review moving.
  adoptShare(data, true);
  VSShell.setWatching(data.watching);
  noteWatching(data.watching);
  VSShell.setServerVersion(data.version);
  if (data.historyClearedAt && data.historyClearedAt !== S.historyClearedAt) {
    applyHistoryClear(data);
    toast(T('historyCleared'));
    return;
  }
  const bumped = (data.currentVersion || 1) !== S.version;
  if (!bumped && data.html === S.html) {
    // Only the comments moved — fold them in without touching the page.
    const merged = mergeComments(data.comments || []);
    if (merged.changed) {
      render();
      if (S.sel) openComposer(S.sel, false);
      // The reviewer's own reply comes back the same way Claude's does. Only
      // announce the one the reviewer did not write.
      if (merged.agentSpoke) toast(T('replied'));
      if (merged.closed) toast(T('closedSome')(merged.closed));
    }
    return;
  }
  S.pendingUpdate = data;
  // Mid-edit saves are not news — the comments being worked on already say so.
  // Only a version that has actually landed is worth interrupting for.
  if (bumped) {
    /* What Claude closed is news whether or not the reviewer brings the new
       page in — the cards say so straight away, and the banner is only about
       the picture. */
    if (mergeComments(data.comments || []).changed) render();
    const meta = (data.versions || []).find(v => v.n === data.currentVersion);
    showWork((live() ? T('roundReady')(data.currentVersion) : T('ready')(data.currentVersion))
      + (meta?.label ? ' — ' + esc(meta.label) : ''));
  } else if (!S.ann.some(isWorking)) showWork(live() ? T('appChanged') : T('changed'));
}
function showWork (html) {
  $('#workBanner').classList.add('on');
  $('#workText').innerHTML = '<span class="tick">✓</span> ' + html;
}
const hideWork = () => $('#workBanner').classList.remove('on');

/** Is the session on the other end still there? Silent until it knows — a dot
    that says "lost" during the first handshake is just wrong. */
function setLink (up) {
  S.linked = up;
  if (!served() || up === null) { VSShell.hideLink(); return }
  VSShell.setLink(up);
}

/* ─────────────── work in flight ───────────────
   Where a comment has got to is written on the comment, so this reads it rather
   than remembering it: sent and not yet handed over is queued, handed over is
   being worked on. A reload, a second tab and the tab that pressed Send all see
   the same thing. */

/* How long nothing may be listening before a round in hand is called stalled.
   A stream watcher keeps its heartbeat up for the whole time the agent works,
   so a heartbeat that stopped is a session that went away rather than a slow
   one. The wait is what keeps a session restarting mid-round from reading as a
   dead one. */
const STALL_MS = 60000;
let stallTimer = null;
/** Remember when the heartbeat went quiet. Says whether anything changed. */
function noteWatching (value) {
  if (S.watching === value) return false;
  S.watching = value;
  S.unwatchedAt = value === false ? Date.now() : null;
  return true;
}

/** How long nothing has been listening. Zero while something is. */
const quietFor = () => S.watching === false && S.unwatchedAt ? Date.now() - S.unwatchedAt : 0;
/** A round in hand, quiet long enough to call the session behind it gone.
    Everything that would animate progress asks this before claiming any. */
const isStalled = () => quietFor() >= STALL_MS && S.ann.some(isWorking);

function renderWork () {
  const working = S.ann.filter(isWorking).length;
  const queued = S.ann.filter(a => isQueued(a) && isOpen(a)).length;
  const quiet = working > 0 ? quietFor() : 0;
  const stalled = isStalled();
  /* Nothing else calls this while the page sits there waiting, so the strip has
     to wake itself up to change its own mind. The heartbeat stopping is what
     renders here, so the wait is armed on the round being quiet rather than on
     how long it has been quiet — that is still zero on the render the presence
     event triggers, and no further event is coming. */
  clearTimeout(stallTimer);
  stallTimer = working && !stalled && S.watching === false
    ? setTimeout(renderWork, Math.max(0, STALL_MS - quiet)) : null;
  $('#pwork').hidden = !working && !queued;
  $('#pwork').classList.toggle('stalled', stalled);
  const again = $('#btnAgain');
  again.hidden = !stalled || !served() || isHistory();
  again.textContent = T('sendAgain');
  if (working || queued) $('#pworkText').textContent =
    stalled ? T('stalled')(working)
    : !working ? (S.watching === false ? T('notPickedUp')(queued) : T('queuedOn')(queued))
    : queued ? T('workingAndQueued')(working, queued)
    : T('workingOn')(working);
  composer.classList.toggle('working', !stalled && !!S.sel && isWorking(annById(S.sel) || {}));
}

/**
 * Give a stalled round back to the queue.
 *
 * A comment already handed over is not something a new watcher will ever be
 * given, so a session that died holding one strands it where nobody can reach
 * it. This drops only the record of the handover: the comments stay open and
 * still say what they said, and the next session to pick up is given them like
 * any other delivery.
 */
async function sendAgain () {
  const again = $('#btnAgain');
  again.disabled = true;
  try {
    const response = await fetch(API + '/comments/requeue', { method: 'POST' });
    // The agent came back while the button was on screen. It holds them after
    // all, so nothing is taken off it.
    if (response.status === 409) { toast(T('sendAgainRefused')); return }
    if (!response.ok) throw new Error(`requeue failed (${response.status})`);
    const back = new Set((await response.json()).requeued || []);
    for (const a of S.ann) if (back.has(a.id)) a.deliveredAt = null;
    toast(T('sentAgain'));
    render();
  } catch { toast(T('sendFail')) }
  finally { again.disabled = false }
}

/**
 * Fold in the server's list without rolling back something typed here a moment
 * ago and not yet saved.
 *
 * The thread is append-only on both sides, so the union of the two copies is
 * the whole of it and neither can lose a line by being stale. State is the
 * server's alone: this tab never closes a comment and never reopens one, so
 * whatever it says goes.
 */
function mergeComments (serverComments) {
  let changed = false, agentSpoke = false, closed = 0;
  const seen = new Set();
  /* The server leaves a dismissed comment out of the payload, so a payload
     without it is the confirmation this tab was waiting for. Stop hiding the id
     then: a reply reopens a dismissed comment, and it has to be able to come
     back. Anything still listed is a payload the dismissal had not reached. */
  const arriving = new Set(serverComments.map(c => c.id));
  for (const id of S.forgotten) if (!arriving.has(id)) S.forgotten.delete(id);
  for (const incoming of serverComments) {
    // Deleted here a moment ago, and the server has not been told yet.
    if (S.forgotten.has(incoming.id)) continue;
    seen.add(incoming.id);
    const local = annById(incoming.id);
    if (!local) { S.ann.push(normalise(incoming)); changed = true; continue }
    const merged = mergeReplies(local.replies,
      (incoming.replies || []).filter(r => !S.retracted.has(replyKey(r))));
    if (merged.length !== (local.replies || []).length) {
      local.replies = merged;
      S.threadOpen.add(local.id); changed = true;
      if (isAgent(merged.at(-1)?.by)) agentSpoke = true;
    }
    if (incoming.state !== local.state) {
      if (isClosed(incoming)) closed++;
      local.state = incoming.state; changed = true;
    }
    // Delivery and sending are the server's to stamp — it is the one that knows.
    if (incoming.deliveredAt !== local.deliveredAt) { local.deliveredAt = incoming.deliveredAt; changed = true }
    if (incoming.sentAt !== local.sentAt) { local.sentAt = incoming.sentAt; changed = true }
  }
  // Withdrawn somewhere else — another tab, or this one before a reload.
  const gone = S.ann.filter(a => !seen.has(a.id) && sent(a));
  if (gone.length) { S.ann = S.ann.filter(a => seen.has(a.id) || !sent(a)); changed = true }
  // A question waits on the reviewer, so it should not sit behind a closed drawer.
  if (agentSpoke) setPanel(true);
  return { changed, agentSpoke, closed };
}

/** Two copies of one append-only thread, merged into the whole of it. */
const replyKey = r => `${r.by}|${r.at}|${r.text}`;
function mergeReplies (mine = [], theirs = []) {
  const byKey = new Map();
  for (const reply of [...mine, ...theirs]) byKey.set(replyKey(reply), reply);
  return [...byKey.values()].sort((a, b) => Date.parse(a.at || 0) - Date.parse(b.at || 0));
}

/**
 * A published version finishes the comments it names, and only those. The round
 * is over when nothing is left in flight.
 *
 * Both ways of learning about a new version end up here — the announcement and
 * the refresh you take afterwards. They were two copies of this rule, so fixing
 * one left the other putting comments back to Open the moment you looked at the
 * change they were not part of.
 */
function adoptUpdate () {
  const data = S.pendingUpdate;
  S.pendingUpdate = null; hideWork();
  if (!data) { loadFrame(true); return }
  const bumped = (data.currentVersion || 1) !== S.version;
  S.html = data.html; S.versions = data.versions; S.comments = data.comments;
  S.version = data.currentVersion; S.name = data.name || S.name;
  /* A version is a picture of the page, not a verdict on the comments: which
     of those are done was already said by Claude closing them, and is on the
     cards before this banner is touched. */
  mergeComments(data.comments || []);
  if (bumped) S.viewing = S.version;
  closeComposer();
  buildTimeline(); loadFrame(); render();
  if (bumped) toast(live() ? T('nowRound')(S.version) : T('nowReviewing')(S.version));
}

/* ───────────────────── chrome & controls ───────────────────── */

function buildSizes () {
  const wrap = $('#sizeSwitch');
  wrap.innerHTML = '';
  for (const s of SIZES) {
    const b = document.createElement('button');
    b.dataset.size = s.id;
    b.title = `${T(s.id)} — ${s.width} × ${s.height}`;
    b.setAttribute('aria-pressed', String(s.id === S.size.id));
    b.innerHTML = `<svg viewBox="0 0 24 24">${s.icon}</svg>`;
    b.onclick = () => setSize(s.id);
    wrap.appendChild(b);
  }
}
function setSize (id) {
  const s = SIZES.find(x => x.id === id);
  if (!s || s.id === S.size.id) return;
  S.size = s;
  $$('#sizeSwitch button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.size === id)));
  closeComposer();
  // The frame height follows the new viewport, so refit before anything reads it.
  applyWindowSize(); fitFrameHeight(); fitZoom(); drawMarks(); renderPanel();
}
/** Re-label every static surface. Comment text is the reviewer's, never ours. */
function applyLang () {
  const mv = $('#modeSwitch [data-mode=view]'), ma = $('#modeSwitch [data-mode=annotate]');
  // The words live in their own span so the icon beside them survives, and both
  // buttons carry the name on themselves — under the compact breakpoint the
  // word is gone and the icon is all a reader, or a screen reader, has.
  $('.lbl', mv).textContent = T('viewLabel'); mv.title = T('view');
  $('.lbl', ma).textContent = T('annotateLabel'); ma.title = T('annotate');
  mv.setAttribute('aria-label', T('view'));
  ma.setAttribute('aria-label', T('annotate'));
  /* The toolbar is icons alone, so each button says on hover what it is, what
     key picks it, and what gesture it takes — a picture of a pen does not say
     that clicking leaves a point and dragging leaves a box. Its own bubble
     rather than the browser's, which arrives a second late and lands wherever
     it likes; the same three parts go to a screen reader as one sentence. */
  for (const [tool, name, key, how] of
       [['comment', 'commentLabel', 'c', 'commentHow'],
        ['move', 'moveLabel', 'm', 'moveHow'],
        ['delete', 'deleteLabel', 'd', 'deleteHow']]) {
    const b = $(`#toolbar [data-tool=${tool}]`);
    $('.tip', b).innerHTML =
      `<b>${esc(T(name))}</b><kbd>${key}</kbd><em>${esc(T(how))}</em>`;
    b.setAttribute('aria-label', `${T(name)} (${key}) — ${T(how)}`);
  }
  $('#hiNew .lbl').textContent = T('hiNew');
  $('#hiNew').title = T('hiNewTitle');
  renderReset();
  $('#btnReload').title = T('reloadTitle');
  $('#btnNow').textContent = T('backToCurrent');
  $('#btnRefresh').textContent = T('reviewChanges');
  $('#btnDismissWork').textContent = T('later');
  $('#btnCopyShare').textContent = T('copyLink');
  $('#btnDismissShare').textContent = T('later');
  if ($('#shareBanner').classList.contains('on')) showShareReady();
  renderApprove(); renderShare();
  composer.querySelector('.csave').innerHTML = esc(T('save')) + ' <span class="kbd">⏎</span>';
  composer.querySelector('.hint').textContent = T('newlineHint');
  setLink(S.linked);
  renderWork();
  $('#phead').querySelector('b').textContent = T('comments');
  $('#btnGeneral').title = T('addGeneral');
  $('#btnGeneral').setAttribute('aria-label', T('addGeneral'));
  $('#btnGeneral').hidden = isHistory();
  renderCounts();   // the primary button says Send or Stop depending on the round
  renderClearDialog();
  renderHistoryButton();
  renderHistoryDialog();
  buildSizes();
  render(); syncTimeline();
  if (S.sel) openComposer(S.sel, false);
}
function setLang (l) {
  if (l === LANG) return;
  LANG = l;
  applyLang();
}

/* How tall the chrome ended up. At compact widths the comments float over the
   page and have to start under it, and the bar is not always all of it — the
   shell can put an update notice below the bar, and a notice the panel covers
   is one nobody can dismiss. */
function measureChrome () {
  const bar = $('.vs-topbar');
  const chrome = bar.parentElement?.classList.contains('vs-chrome') ? bar.parentElement : bar;
  const fit = () => document.documentElement.style
    .setProperty('--chromeh', chrome.offsetHeight + 'px');
  new ResizeObserver(fit).observe(chrome);
  fit();
}

function wireChrome () {
  $$('#modeSwitch button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
  $$('#toolbar button').forEach(b => b.onclick = () => setTool(b.dataset.tool));
  $('#btnClear').onclick = openClearDialog;
  $('#btnCancelClear').onclick = () => $('#clearDialog').close();
  $('#btnConfirmClear').onclick = confirmClearComments;
  $('#clearDialog').onclick = e => { if (e.target === $('#clearDialog')) $('#clearDialog').close() };
  $('#clearDialog').addEventListener('cancel', e => { e.preventDefault(); $('#clearDialog').close() });
  $('#btnClearHistory').onclick = openHistoryDialog;
  $('#btnReset').onclick = () => { VSShell.closeSettings?.(); openResetDialog() };
  $('#btnCancelReset').onclick = () => $('#resetDialog').close();
  $('#btnConfirmReset').onclick = confirmReset;
  $('#resetDialog').onclick = e => { if (e.target === $('#resetDialog') && !S.resetting) $('#resetDialog').close() };
  $('#resetDialog').addEventListener('cancel', e => {
    e.preventDefault();
    if (!S.resetting) $('#resetDialog').close();
  });
  $('#btnCancelHistory').onclick = () => $('#historyDialog').close();
  $('#btnConfirmHistory').onclick = confirmClearReviewHistory;
  $('#historyDialog').onclick = e => { if (e.target === $('#historyDialog') && !S.clearingHistory) $('#historyDialog').close() };
  $('#historyDialog').addEventListener('cancel', e => {
    e.preventDefault();
    if (!S.clearingHistory) $('#historyDialog').close();
  });
  VSShell.onLang(setLang);   /* the switch is the shell's; this is the workspace's answer */
  $('#btnReload').onclick = () => S.pendingUpdate ? adoptUpdate() : loadFrame(true);
  $('#btnNow').onclick = () => gotoVersion(S.version);
  $('#btnRefresh').onclick = adoptUpdate;
  $('#btnDismissWork').onclick = hideWork;
  $('#btnCopyShare').onclick = () => { if (S.share.url) copy(S.share.url); hideShare() };
  $('#btnDismissShare').onclick = hideShare;
  // One button, on the panel's edge: it pushes the comments away and pulls them
  // back, so there is never a second control saying the same thing elsewhere.
  $('#panelHandle').onclick = () => setPanel(!document.body.classList.contains('panelopen'));
  $('#btnGeneral').onclick = addGeneral;
  $('#btnAgain').onclick = sendAgain;
  // Open beside the page when there is room for it, away when there is not —
  // and back to that default whenever the window crosses the line, rather than
  // carrying a choice made about one shape over into the other.
  const wide = window.matchMedia('(min-width:721px)');
  setPanel(wide.matches);
  wide.addEventListener('change', e => setPanel(e.matches));
  $('#canvasWrap').addEventListener('scroll', reposition);
  $('#viewportBox').addEventListener('scroll', reposition);
}
let repositionQueued = false;
function reposition () {
  if (repositionQueued) return;
  repositionQueued = true;
  requestAnimationFrame(() => { repositionQueued = false; placeComposer() });
}

/* ───────────────────── the page's window ─────────────────── */

const frame = $('#frame'), overlay = $('#overlay'), browser = $('#browser'),
      vpBox = $('#viewportBox'), scroller = $('#scroller');
let fdoc = null;

/** Both bundled modes carry every stop inside the file rather than fetching it. */
const inlined = () => S.runtime === 'artifact' || S.runtime === 'phase';

function frameSrc () {
  if (isHistory()) {
    if (inlined()) {
      return { srcdoc: S.versions.find(v => v.n === S.viewing)?.html
        || '<p style="font:14px system-ui;padding:24px">Not captured in this bundle.</p>' };
    }
    return { src: `${API}/version/${S.viewing}` };
  }
  // Live: the app is served through this same origin, so the frame just asks
  // for a route. Reloading keeps the reviewer where they were rather than
  // dumping them back at the front door.
  if (live()) return { src: S.route || S.startPath || '/' };
  return inlined() ? { srcdoc: S.html } : { src: `/page?t=${Date.now()}` };
}
function applyWindowSize () {
  browser.style.width = S.size.width + 'px';
  vpBox.style.height = S.size.height + 'px';
  $('#winSize').textContent = `${S.size.width} × ${S.size.height}`;
}
/* An app navigates itself. Every load after the one we asked for is the
   reviewer clicking through it, and those must not steal back the zoom they
   set or the scroll position they chose to leave. */
let askedForLoad = false;
function loadFrame (keepScroll) {
  const sc = keepScroll ? vpBox.scrollTop : 0;
  applyWindowSize();
  const src = frameSrc();
  askedForLoad = true;
  if (src.srcdoc !== undefined) { frame.removeAttribute('src'); frame.srcdoc = src.srcdoc }

const hasVersionHistory = () => S.versions.some(v => v.n !== S.version);

   a store written by the version before it, and reading one is a courtesy, not
   a promise — this is the way out when the courtesy is not enough. It is behind
   the cog because it is not part of reviewing, and behind a confirmation
   because nothing it deletes comes back. */

    : T('resetImpact')(comments, S.versions.length);

  if (S.resetting) return;
  S.resetting = true;
  renderReset(); renderResetDialog();
  try {
    const response = await fetch(API + '/reset', { method: 'POST' });
    if (response.status === 404) throw new Error('old');
    if (!response.ok) throw new Error(`reset failed (${response.status})`);
  } catch (error) {
    const old = error?.message === 'old';
    S.resetting = false;
    renderReset(); renderResetDialog();
    toast(T(old ? 'resetOld' : 'resetFail'));
    return;
  }
  /* Everything this tab holds is about the review that just went — the frame,
     the timeline, the cards, the drafts. Reading it back in is the reload it
     would take anyway, and it is the one moment where losing the page is the
     point rather than a rudeness. */
  location.reload();
}

function applyHistoryClear (data) {
  const wasHistory = isHistory();
  if (wasHistory) closeComposer();
  if ($('#historyDialog').open) $('#historyDialog').close();
  S.historyClearedAt = data.historyClearedAt || S.historyClearedAt;
  S.versions = data.versions || S.versions.filter(v => v.n === S.version);
  S.viewing = S.version;
  S.clearingHistory = false;
  if (wasHistory) { setMode('annotate'); loadFrame() }
  buildTimeline(); render();

async function confirmClearReviewHistory () {
  if (!hasVersionHistory() || S.clearingHistory) return;
  /* Confirmation is the end of the modal interaction. Closing immediately also
     keeps any network error toast in the visible top layer instead of behind a
     native dialog backdrop. */
  S.clearingHistory = true;
  $('#historyDialog').close();
  renderHistoryButton();
  try {
    const res = await fetch(API + '/history/clear', { method: 'POST' });
    const type = res.headers.get('content-type') || '';
    const data = type.includes('application/json') ? await res.json() : {};
    if (!res.ok) {
      const error = new Error(data.error || `clear failed (${res.status})`);
      error.status = res.status;
      throw error;
    }
    applyHistoryClear(data);
    toast(T('historyCleared'));
  } catch (error) {
    S.clearingHistory = false;
    renderHistoryButton();
    toast(error?.status === 404 ? T('historyClearRestart') : T('historyClearFail'));

const versionList = () => {
  const ns = S.versions.map(v => v.n).sort((a, b) => a - b);

  || (S.runtime === 'phase' ? T('phaseOf')(n) : live() ? `Round ${n}` : `Version ${n}`);

  const d = S.versions.find(v => v.n === n)?.date;
  if (!d) return '';
  const dt = new Date(d);

    then, which is the only question the phase view is asked. */
function subFor (n) {
  if (S.runtime === 'phase') {
    return (S.versions.find(v => v.n === n)?.goal || '')
      + (n === S.version ? (S.versions.find(v => v.n === n)?.goal ? ' · ' : '') + T('phaseCur') : '');
  }
  const openN = S.ann.filter(a => isOpen(a) && hasSubstance(a)).length;

    + (openN ? ` · ${openN} open` : '')

   something that was never really there — so a live review has comments and no
   timeline at all. */
const scrubItems = () =>
  live() ? [] : versionList().map(n => ({ id: n, cap: capFor(n), label: labelFor(n), sub: subFor(n) }));

function buildTimeline () {
  /* A live review has no versions to move between, so the whole row goes rather
     than sitting there empty with a track that does nothing. */
  const timeline = $('#timeline');

function syncTimeline () {
  VSScrub.set({ items: scrubItems(), active: S.viewing });

  S.viewing = n;

  loadFrame(); syncTimeline(); renderPanel();
}
VSScrub.mount({ onPick: gotoVersion });

/**
 * Where a comment is, written the way a person would say it: the thing it is on
 * first, the part of the page it lives in second, coordinates last. The brief is
 * always in English — the reviewer's own words are the only part that is not.
 */
function whereLine (a) {
  if (a.kind === 'general') return 'the page as a whole — not attached to an element';
  const geo = a.kind === 'area' && a.rect
    ? `area ${Math.round(a.rect.w)}×${Math.round(a.rect.h)} at ${Math.round(a.rect.x)},${Math.round(a.rect.y)}`
    : `at ${Math.round(a.point?.x || 0)},${Math.round(a.point?.y || 0)}`;
  const an = a.anchor;
  if (!an) return `${geo}${a.anchorText ? ` — on “${a.anchorText}”` : ''}`;
  const words = an.text || an.label;
  const reg = an.region;
  const region = !reg ? ''
    : reg.kind === 'region' ? (reg.label ? ` inside “${reg.label}”,` : '')
    : ` inside ${reg.kind}${reg.label ? ` “${reg.label}”` : ''},`;
  return `on ${elLine(an)}${words ? ` “${words}”` : ''},${region} ${geo}`;
}
/** An element written as its own opening tag — what to search the source for. */
const elLine = an => '`<' + an.tag + (an.id ? ` id="${an.id}"` : '') +
  (an.cls ? ` class="${an.cls}"` : '') + (an.role ? ` role="${an.role}"` : '') + '>`';

/**
 * A move, said as a place rather than as a distance. The pixels are the weakest
 * part of it — a page that reflows makes them wrong — so the element it was
 * dropped on leads, and the drag is what is left when there was nothing there.
 */
function moveLine (a) {
  const d = a.delta || { dx: 0, dy: 0 };
  const dragged = `dragged ${Math.abs(d.dx)}px ${d.dx >= 0 ? 'right' : 'left'} and ${Math.abs(d.dy)}px ${d.dy >= 0 ? 'down' : 'up'}`;
  const t = a.target;
  if (!t?.anchor) return `somewhere else on the page — ${dragged}. Nothing was under the drop, so the direction is all they gave you.`;
  const words = t.anchor.text || t.anchor.label;
  const place = t.where === 'inside' ? 'into' : t.where === 'before' ? 'before' : 'after';
  return `${place} ${elLine(t.anchor)}${words ? ` “${words}”` : ''} (${dragged})`;
}
/** A strike: the exact words to take out, or the element to take out whole. */
const strikeLine = a => a.scope === 'text'
  ? `the text “${trim(a.text, 160)}” — remove those words, leave the rest of the element`
  : 'this element and everything in it';

/** Everything the box was drawn around, in the order it appears on the page. */
const coversLine = a => a.covers.map(c => `\`<${c.tag}>\` “${c.text}”`).join(' · ') +
  (a.covers.length >= COVER_MAX ? ' · …' : '');

function buildFeedback () {
  /* Everything handed over and not yet done — not everything written. Sending
     one comment on its own must not shrink the brief to that comment, or the
     ones already out would quietly drop off the list Claude is working from.
     Landed counts as done: a version this tab has not adopted yet already
     addressed it, and a brief built between the announcement and the refresh —
     the held queue flushing is exactly that moment — must not hand it back. */
  const items = S.ann.filter(a => isOpen(a) && hasSubstance(a) && sent(a));

  const L = [];
  L.push(live()
    ? `# Live UI review — ${S.name} · v${S.version}`
    : `# Wireframe review — ${S.name} · v${S.version}`);
  L.push(`${items.length} open comment(s) — every one is a must`);
  L.push('');
  if (live()) {
    // What is under review is running code, so the change is a code change.
    // Every comment names the route it was made on: that route is the way back
    // to the screen, and the way to the component that renders it.
    L.push(`These are comments on the app running at \`${S.app || S.fileName}\` — change the source, ` +
      'not a mockup. Each comment says which **route** it was made on; the anchor names the ' +
      'element, which is what to search the codebase for.');
    L.push('');
    L.push('The reviewer is looking at the app right now. If it hot-reloads they will see your ' +
      'change as you make it, so land whole changes rather than half of one.');
  } else {
    L.push(`Apply these to \`${S.fileName}\`, then publish the next version.`);
  }
  /* Two of the marks are drawn instead of written, so a brief that carries one
     has to say what the drawing meant — a comment with no words is otherwise
     read as a comment nobody finished. */
  const drawn = items.filter(a => a.kind === 'move' || a.kind === 'strike');
  if (drawn.length) {
    L.push('');
    L.push('Some of these were drawn on the page rather than written: **Move it** is an arrow ' +
      'from a thing to where it should go, and **Delete** is something struck out. They are ' +
      'instructions in their own right — a note on one adds to it, and no note means there was ' +
      'nothing to add.');
  }
  L.push('');

  const bySize = {};
  for (const a of items) (bySize[a.size || 'desktop'] ||= []).push(a);
  for (const sid of SIZES.map(s => s.id)) {
    const list = bySize[sid];
    if (!list?.length) continue;
    const size = SIZES.find(s => s.id === sid);
    // The brief is written for Claude, so it stays in English whatever the
    // workspace is showing. The reviewer's own words pass through untouched.
    L.push(`## ${STR.en[sid]} — ${size.width} × ${size.height}`);
    L.push('');
    for (const a of list) {
      /* Sending again sends everything still open, including whatever went out
         in an earlier brief — the brief is the state of the review, not a diff.
         Say which ones you have already seen so a second read does not become a
         second round of work on the same comment. */
      L.push(`### ${a.id}`);
      if (live() && a.route) L.push(`**Route** \`${a.route}\``);
      L.push(`**Where** ${whereLine(a)}`);
      if (a.kind === 'move') L.push(`**Move it** ${moveLine(a)}`);
      if (a.kind === 'strike') L.push(`**Delete** ${strikeLine(a)}`);
      if (a.covers?.length) L.push(`**Covers** ${coversLine(a)}`);
      if (a.note) L.push(a.note);
      for (const m of a.replies || []) {
        L.push('');
        L.push(`> **${isAgent(m.by) ? 'You asked' : 'They replied'}:** ${m.text}`);
      }
      L.push('');
    }
  }
  L.push('---');
  L.push('Close what you have done. Anything you do not name stays open and comes back next time,');
  L.push('so ask about whatever is unclear instead of guessing:');
  L.push('```bash');
  const subject = live() ? '--name <review-name>' : '--file <page.html>';
  L.push(`node review-server.mjs publish ${subject} --close <ids> --label "<what changed>"`);
  L.push(`node review-server.mjs reply ${subject} --comment <id> --text "<your question>"`);
  L.push('```');

  const payload = {
    page: S.fileName, name: S.name, version: S.version,
    ...(live() ? { reviewing: 'app', app: S.app, routes: [...new Set(items.map(a => a.route).filter(Boolean))] } : {}),
    comments: items.map(a => ({
      id: a.id, kind: a.kind, state: a.state, note: a.note,
      replies: a.replies || [],
      anchorText: a.anchorText || null,
      // What the comment is attached to. `selector` is how the workspace finds
      // the element again to keep the mark on it — a hint for you, not a promise
      // about the markup.
      anchor: a.anchor ? {
        selector: a.anchor.sel, tag: a.anchor.tag, id: a.anchor.id || null,
        classes: a.anchor.cls || null, role: a.anchor.role || null,
        label: a.anchor.label || null, text: a.anchor.text || null,
        region: a.anchor.region || null,
      } : null,
      // For an area: what was inside the box when it was drawn.
      covers: a.covers?.length ? a.covers : null,
      /* For a move: `anchor` is the thing to move, and this is where to. Take
         `target` over `delta` — the element it was dropped on and which side of
         it survive a reflow, and the pixel distance does not. `where` is
         `inside`, `before` or `after` that element. */
      move: a.kind === 'move' ? {
        target: a.target?.anchor ? {
          selector: a.target.anchor.sel, tag: a.target.anchor.tag,
          id: a.target.anchor.id || null, classes: a.target.anchor.cls || null,
          label: a.target.anchor.label || null, text: a.target.anchor.text || null,
          region: a.target.anchor.region || null,
          where: a.target.where,
        } : null,
        delta: a.delta || null,
      } : null,
      /* For a delete: `text` scope means remove exactly those words from the
         anchored element; `element` means remove the anchored element whole. */
      strike: a.kind === 'strike' ? { scope: a.scope, text: a.scope === 'text' ? a.text : null } : null,
      screenSize: a.size || 'desktop',
      // Live: the screen of the app this was said about.
      route: a.route || null,
      point: a.point || null, rect: a.rect || null,
      seenAt: a.seenAt || S.version,
    })),
  };
  return {
    markdown: L.join('\n') + '\n\n```json\n' + JSON.stringify(payload, null, 2) + '\n```\n',
    feedback: payload,
    counts: { total: items.length },
  };
}


/**
 * Let go of what has been written. With no argument that is everything still
 * here; with an id it is that one, which joins whatever Claude already has.
 * Sending is not a batch — the comment joins the list the server holds, and
 * goes out with everything else still open on the next tick.
 */
async function openSend (only) {
  closeComposer();
  const at = new Date().toISOString();
  // DOM event handlers pass the click event as their first argument. Only an
  // explicit id is a scoped send; everything else means send all.
  const scope = typeof only === 'string' ? only : null;
  const candidates = scope ? [annById(scope)].filter(Boolean) : S.ann;
  const going2 = candidates.filter(a => !sent(a) && hasSubstance(a) && isOpen(a));
  if (!going2.length) return;
  if (S.runtime === 'artifact') {
    const pending = buildFeedback();
    await copy(pending.markdown);
    // Copied out is out: the words are on their way to Claude in a paste, and
    // editing them here afterwards would change only this screen.
    for (const a of going2) a.sentAt = at;
    save(); render();
    return;
  }
  try {
    /* Letting go of a comment is the whole of sending it. It joins the list the
       server already holds and goes out on the next tick, so there is no batch
       to time and nothing to hold back — Claude gets everything still open,
       whenever each of them was written. */
    for (const a of going2) a.sentAt = at;
    const response = await fetch(API + '/comments', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ comments: S.ann.filter(hasSubstance) }),
    });
    if (!response.ok) throw new Error(`send failed (${response.status})`);
    const receipt = await response.json();
    mergeComments(receipt.comments || []);
    render();
    toast(T('working')(going2.length));
  } catch {
    // Failed is unsent, so the button has to work again.
    for (const a of going2) a.sentAt = null;
    render();
    toast(T('sendFail'));
  }
}
$('#btnSend').onclick = () => openSend();

/* ─────────────── approve: the way out of the loop ───────────────
   Send says "one more round". Approve says the design is done — it closes the
   review, which ends the server and hands Claude back the thread. It sits under
   the same button because it is the same decision, answered the other way. */
const sendMenu = $('#sendMenu');
function closeSendMenu () {
  sendMenu.classList.remove('on');
  $('#btnSendMore').setAttribute('aria-expanded', 'false');
  approveConfirm.disarm();
  renderApprove();
}
// Opening the menu is seeing the link — the flag has done its job.
const clearShareFlag = () => $('#btnSendMore').classList.remove('flag');
/* The label is the whole item. It said what approving does and what it would
   leave behind, and both were explaining a two-word button to someone who has
   been reviewing this design all afternoon. The second click still asks. */
function renderApprove () {
  // The shell's armConfirm owns the `armed` class; the words follow it.
  const armed = $('#btnApprove').classList.contains('armed');
  $('#btnApprove .t').textContent = armed ? T('approveSure') : T('approve');
  $('#btnApprove .d').textContent = '';
}

$('#btnSendMore').onclick = e => {
  e.stopPropagation();
  const on = !sendMenu.classList.contains('on');
  closeSendMenu();
  if (!on) return;
  sendMenu.classList.add('on');
  $('#btnSendMore').setAttribute('aria-expanded', 'true');
  clearShareFlag();
  renderApprove(); renderShare();
};
// Signing off ends the review for everyone, so it asks once before acting.
const approveConfirm = VSShell.armConfirm($('#btnApprove'), {
  onConfirm: () => approve(),
  arm: renderApprove, disarm: renderApprove,
});
document.addEventListener('pointerdown', e => {
  if (sendMenu.classList.contains('on') && !e.target.closest('#sendMenu, #btnSendMore')) closeSendMenu();
});

/* ─────────────── the shareable copy ───────────────
   The workspace cannot publish an Artifact — only Claude can. So this asks, the
   same way approve asks, and the link comes back down the same wire the page
   reloads on. */
function adoptShare (data, announce) {
  const had = S.share.url;
  S.share = {
    url: data.shareUrl || null,
    version: data.shareVersion || null,
    pending: !!data.sharePending,
  };
  const fresh = !!S.share.url && S.share.url !== had;
  if (fresh) $('#btnSendMore').classList.add('flag');
  renderShare();
  // A toast at the bottom of the screen outlives nobody's attention for a wait
  // this long. Announce it the way a new version is announced.
  if (fresh && announce) showShareReady();
}
function showShareReady () {
  $('#shareBannerText').innerHTML = '<span class="tick">✓</span> ' + T('shareBannerReady');
  $('#shareBanner').classList.add('on');
}
const hideShare = () => $('#shareBanner').classList.remove('on');
function renderShare () {
  const b = $('#btnShare');
  // Nothing to publish in a live review: what is under the marks is somebody's
  // running app, reachable only from this machine, and a link to a wireframe is
  // not a thing this review has.
  if (S.runtime === 'artifact' || live() || !canShareArtifact()) {
    b.hidden = true; $('#shareRule').hidden = true; return;
  }
  const s = S.share;
  b.disabled = s.pending;
  if (s.pending) { b.querySelector('.t').textContent = T('shareWorking'); b.querySelector('.d').textContent = T('shareWait'); return }
  if (s.url && s.version === S.version) {
    b.querySelector('.t').textContent = T('shareReady');
    b.querySelector('.d').innerHTML = `<span class="url">${esc(s.url)}</span>`;
    return;
  }
  // The label says what the button does; only a stale link needs explaining.
  b.querySelector('.t').textContent = s.url ? T('shareStale') : T('share');
  b.querySelector('.d').textContent = s.url ? T('shareStaleHint')(s.version) : '';
}
async function requestShare () {
  const s = S.share;
  // A link that is already current is a link to copy, not one to ask for again.
  if (s.url && s.version === S.version) { copy(s.url); closeSendMenu(); return }
  S.share.pending = true; renderShare();
  try {
    await fetch(API + '/share', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ version: S.version }),
    });
    toast(T('shareAsked'));
  } catch { S.share.pending = false; renderShare(); toast(T('shareFail')) }
  closeSendMenu();
}
$('#btnShare').onclick = requestShare;

async function approve () {
  closeSendMenu();
  const all = new Map(S.ann.map(a => [a.id, a]));
  const open = [...all.values()].filter(a => isOpen(a) && hasSubstance(a));
  if (S.runtime === 'artifact') { showDone(); return }
  try {
    const response = await fetch(API + '/approve', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        version: S.version,
        expectedOpenCount: open.length,
      }),
    });
    if (!response.ok) throw new Error(`approval failed (${response.status})`);
    showDone();
  } catch { toast(T('approveFail')) }
}
function showDone () {
  clearWorking();
  closeComposer();
  setMode('view');
  hideWork(); hideShare();
  $('#doneTitle').textContent = T('approvedTitle');
  $('#doneBody').textContent = T('approvedBody');
  $('#doneScreen').classList.add('on');
}
async function copy (t) {
  try { await navigator.clipboard.writeText(t); toast(T('copied')) }
  catch {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove(); toast(T('copied'));
  }
}
function toast (m) { VSShell.toast(m) }

boot();
</script>
</body>
</html>
